name: common_descent_listing
description: "An offline catalogue of Common Descent episodes and news."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  just_audio: 0.10.6
  file_selector: 1.1.0
  path_provider: 2.1.6
  url_launcher: 6.3.3
  yaml: 3.1.4
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/segments.yaml
    - assets/data/apple_podcasts_episodes.json
    - assets/transcripts/episode-208-karoo-reviewed.json
