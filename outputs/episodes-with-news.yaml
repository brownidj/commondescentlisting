    title: "The Western Interior Seaway"
    original_title: "Episode 71 - The Western Interior Seaway"
    date: "2019-10-05"
    published_raw: "Sat, 05 Oct 2019 19:38:55 -0500"
    type: "Main"
    rss_episode_type: "full"
    page_url: "https://commondescentpodcast.podbean.com/e/episode-71-the-western-interior-seaway/"
    audio_url: "https://mcdn.podbean.com/mf/web/nhf9fn/Episode_71_-_The_Western_Interior_Seaway.mp3"
    guid: "commondescentpodcast.podbean.com/episode-71-the-western-interior-seaway-a329e68faf7a087ec2d359fc3c0acf08"
    description: "During the Cretaceous Period, North America flooded. The entire middle section of the continent was submerged, creating an inland sea that stretched from the Arctic to the Gulf of Mexico and hosted a unique and fascinating underwater ecosystem. Not only that, but it split west from east, creating two distinct \"subcontinents.\" In this episode, we explore how this sea came to be, what lived within it, and what effect it had on land ecosystems of the time and the fossil record they left behind.\nIn the news: more crocs, the oldest fossils, a history of CO2, and unexpected fossil sex.\nTime markers:\nIntro & Announcements: 00:00:00\nNews: 00:04:30\nMain discussion, Part 1: 00:33:00\nMain discussion, Part 2: 01:11:00\nPatron question: 01:35:00\nCheck out our blog for bonus info and pictures:\nhttp://commondescentpodcast.wordpress.com/\nThe Common Descent Store is open! Get merch! http://zazzle.com/common_descent\nFollow and Support us on:\nPatreon: https://www.patreon.com/commondescentpodcast\nTwitter: https://twitter.com/CommonDescentPC\nFacebook: https://www.facebook.com/commondescentpodcast/\nPodBean: https://commondescentpodcast.podbean.com/\niTunes: https://itunes.apple.com/us/podcast/the-common-descent-podcast/id1207586509?mt=2\nYouTube: https://www.youtube.com/channel/UCePRXHEnZmTGum2r1l2mduw\nThe Intro and Outro music is “On the Origin of Species” by Protodome.\nMore music like this at http://ocremix.org.\nMusical Interludes are \"Professor Umlaut\" by Kevin MacLeod (incompetech.com). Licensed under Creative Commons: By Attribution 3.0\nhttp://creativecommons.org/licenses/by/3.0/"
