    title: "The Great American Biotic Interchange (GABI)"
    original_title: "Episode 43 - The Great American Biotic Interchange (GABI)"
    date: "2018-09-09"
    published_raw: "Sun, 09 Sep 2018 00:04:56 -0500"
    type: "Main"
    rss_episode_type: "full"
    page_url: "https://commondescentpodcast.podbean.com/e/episode-43-the-great-american-biotic-interchange-gabi/"
    audio_url: "https://mcdn.podbean.com/mf/web/iwwfq9/Episode_43_-_The_Great_American_Biotic_Interchange.mp3"
    guid: "commondescentpodcast.podbean.com/episode-43-the-great-american-biotic-interchange-gabi-a0b476aa277348dfb409fb76fdeec384"
    description: "For tens of millions of years, North and South America were separate sisters across the sea, each with their own unique ecosystems. But around 3 million years ago, the Isthmus of Panama brought the landmasses together and kicked off an incredible mass migration of life between the continents. Some species thrived, others suffered, and in the end the very ecosystem structure of both continents was drastically altered, setting the stage for the American wildlife we know today.\nIn the news: prehistoric parasites, early turtle evolution, teeth through time, and a surprising hominin hybrid. Also, a devastating museum fire in Brazil.\nTime markers:\nIntro & Announcements: 00:00:00\nNews: 00:06:00\nMain discussion, Part 1: 00:38:30\nMain discussion, Part 2: 01:04:00\nPatron question: 01:35:00\nCheck out our blog for bonus info and pictures:\nhttp://commondescentpodcast.wordpress.com/\nFollow and Support us on:\nPatreon: https://www.patreon.com/commondescentpodcast\nTwitter: https://twitter.com/CommonDescentPC\nFacebook: https://www.facebook.com/commondescentpodcast/\nPodBean: https://commondescentpodcast.podbean.com/\niTunes: https://itunes.apple.com/us/podcast/the-common-descent-podcast/id1207586509?mt=2\nYouTube: https://www.youtube.com/channel/UCePRXHEnZmTGum2r1l2mduw\nThe Intro and Outro music is “On the Origin of Species” by Protodome.\nMore music like this at http://ocremix.org.\nMuscial Interludes are \"Professor Umlaut\" by Kevin MacLeod (incompetech.com). Licensed under Creative Commons: By Attribution 3.0\nhttp://creativecommons.org/licenses/by/3.0/"
