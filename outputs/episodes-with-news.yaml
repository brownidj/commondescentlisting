    original_title: "Episode 214 - Saber Teeth"
    date: "2025-03-29"
    published_raw: "Sat, 29 Mar 2025 19:00:00 -0500"
    type: "Main"
    rss_episode_type: "full"
    page_url: "https://commondescentpodcast.podbean.com/e/episode-214-saber-teeth/"
    audio_url: "https://mcdn.podbean.com/mf/web/ka75qmi2jqgmhi3r/Episode_214_Saber_Teeth.mp3"
    guid: "commondescentpodcast.podbean.com/1d5be118-c5ae-30d5-b674-3ddba334e3e5"
    description: "Evolution just loves a nice pair of oversized canines, especially on mammalian predators. Saber-toothed animals have shown up over and over again – we even have some today – but despite their similarities, not all of these toothy species were using their canines the same way. This episode, we explore the various shapes of functions of saber teeth and the disparate lineages that have sported them.\nIn the news: The Fossil Keeper’s Treasure, the size of megalodon, and vulture feathers.\nTime markers:\nIntro & Announcements: 00:00:00\nNews: 00:07:00\nMain discussion, Part 1: 00:44:30\nMain discussion, Part 2: 01:28:30\nPatron question: 02:27:30\nCheck out our website for this episode’s blog post and more: http://commondescentpodcast.com/\nJoin us on Patreon to support the podcast and enjoy bonus content: https://www.patreon.com/commondescentpodcast\nThe Fossil Keeper’s Treasure: https://www.edelweiss.plus/#sku=1917044267&g=4400\nFind Amy online at @MaryAnningsRevenge\nSupport links:\nNational Immigrant Justice Center: https://immigrantjustice.org\nResearcher Support Consortium: https://researchersupport.org/\nGot a topic you want to hear about? Submit your episode request here: https://commondescentpodcast.com/request-a-topic/\nLots more ways to connect with us: https://linktr.ee/common_descent\nThe Intro and Outro music is “On the Origin of Species” by Protodome. More music like this at http://ocremix.org\nMusical Interludes are \"Professor Umlaut\" by Kevin MacLeod (incompetech.com). Licensed under Creative Commons: By Attribution 3.0 http://creativecommons.org/licenses/by/3.0"
