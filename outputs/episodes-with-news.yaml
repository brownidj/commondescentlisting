    title: "The Bone Wars"
    original_title: "Episode 58 - The Bone Wars"
    date: "2019-04-06"
    published_raw: "Sat, 06 Apr 2019 21:06:21 -0500"
    type: "Main"
    rss_episode_type: "full"
    page_url: "https://commondescentpodcast.podbean.com/e/episode-58-the-bone-wars/"
    audio_url: "https://mcdn.podbean.com/mf/web/8xxfef/Episode_58_-_The_Bone_Wars.mp3"
    guid: "commondescentpodcast.podbean.com/episode-58-the-bone-wars-704fca1e7d9822c0b8d2874c44574317"
    description: "It was the late 1800s, and paleontology was just getting started in the Americas. Two prolific and passionate scientists, Edward Drinker Cope and Othniel Charles Marsh, among the earliest prominent fossil researchers on the continent, struck up a legendary rivalry. Their battles took place in the field and in the literature, and over three decades they engaged in some of the nastiest and most petulant quarreling in scientific history. This infamous era in early paleontology became known as The Bone Wars.\nIn the news: an egg in an ancient bird, a new mastodon, a giant T. rex, and the day the Cretaceous ended.\nTime markers:\nIntro & Announcements: 00:00:00\nNews: 00:05:00\nMain discussion, Part 1: 00:39:30\nMain discussion, Part 2: 01:07:30\nPatron question: 01:47:30\nThe Common Descent Store is open! Get merch! http://zazzle.com/common_descent\nCheck out our blog for bonus info and pictures:\nhttp://commondescentpodcast.wordpress.com/\nFollow and Support us on:\nPatreon: https://www.patreon.com/commondescentpodcast\nTwitter: https://twitter.com/CommonDescentPC\nFacebook: https://www.facebook.com/commondescentpodcast/\nPodBean: https://commondescentpodcast.podbean.com/\niTunes: https://itunes.apple.com/us/podcast/the-common-descent-podcast/id1207586509?mt=2\nYouTube: https://www.youtube.com/channel/UCePRXHEnZmTGum2r1l2mduw\nThe Intro and Outro music is “On the Origin of Species” by Protodome.\nMore music like this at http://ocremix.org.\nMuscial Interludes are \"Professor Umlaut\" by Kevin MacLeod (incompetech.com). Licensed under Creative Commons: By Attribution 3.0\nhttp://creativecommons.org/licenses/by/3.0/"
