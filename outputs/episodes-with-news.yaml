  - episode_number: "179"
    rss_episode_number: "260"
    title: "Thermoregulation"
    original_title: "Episode 179 - Thermoregulation"
    date: "2023-11-25"
    published_raw: "Sat, 25 Nov 2023 19:00:00 -0500"
    type: "Main"
    rss_episode_type: "full"
    page_url: "https://commondescentpodcast.podbean.com/e/episode-179-thermoregulation/"
    audio_url: "https://mcdn.podbean.com/mf/web/phmavp/Episode_179_Thermoregulation.mp3"
    guid: "commondescentpodcast.podbean.com/a4655709-1dc1-32f1-96ce-63a7808dc279"
    description: "If things get too hot or too cold, the crucial processes inside the cells and tissues of living organisms stop working properly, and that’s bad. So, organisms expend a lot of time and energy managing their body temperatures. This episode, we break down the familiar concepts of “warm-blooded” and “cold-blooded,” we discuss the many adaptations that animals use to manage the heat, we explore what evidence allows us to interpret thermoregulatory strategies in the fossil record, and we investigate what is known about how these strategies have evolved over time.\nIn the news: soft robot echinoderms, bird tracks, taste evolution, and dinosaur eggs.\nTime markers:\nIntro & Announcements: 00:00:00\nNews: 00:04:45\nMain discussion, Part 1: 00:36:00\nMain discussion, Part 2: 01:20:30\nPatron question: 1:59:00\nCheck out our website for this episode’s blog post and more:\nhttp://commondescentpodcast.com/\nThe End of the Year Q&A submission form is open! Submit your question here:\nhttps://forms.gle/EeAMhEfnatVWqmnS9\nJoin us on Patreon to support the podcast and enjoy bonus content: https://www.patreon.com/commondescentpodcast\nGot a topic you want to hear about? Submit your episode request here:\nhttps://commondescentpodcast.com/request-a-topic/\nWe’re an Audible Affiliate Partner! Use this link for a 30-day free trial to Audible: https://www.audibletrial.com/CommonDescent\nLots more ways to connect with us: https://linktr.ee/common_descent\nThe Intro and Outro music is “On the Origin of Species” by Protodome.\nMore music like this at http://ocremix.org.\nMusical Interludes are \"Professor Umlaut\" by Kevin MacLeod (incompetech.com). Licensed under Creative Commons: By Attribution 3.0\nhttp://creativecommons.org/licenses/by/3.0/"
