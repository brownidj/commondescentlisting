    rss_episode_number: "174"
    title: "India"
    original_title: "Episode 119 - India"
    date: "2021-08-07"
    published_raw: "Sat, 07 Aug 2021 20:30:59 -0500"
    type: "Main"
    rss_episode_type: "full"
