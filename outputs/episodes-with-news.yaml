    title: "Camels"
    original_title: "Episode 250 - Camels"
    date: "2026-08-15"
    published_raw: "Sat, 15 Aug 2026 19:00:00 -0500"
    type: "Main"
    rss_episode_type: "full"
    page_url: "https://commondescentpodcast.podbean.com/e/episode-250-camels/"
