  - episode_number: "138"
    rss_episode_number: "201"
    title: "The Moon"
    original_title: "Episode 138 - The Moon"
    date: "2022-04-30"
    published_raw: "Sat, 30 Apr 2022 19:15:00 -0500"
    type: "Main"
    rss_episode_type: "full"
    page_url: "https://commondescentpodcast.podbean.com/e/episode-138-the-moon/"
    audio_url: "https://mcdn.podbean.com/mf/web/d8y6dn/Episode_138_The_Moon.mp3"
    guid: "commondescentpodcast.podbean.com/b4f96316-a353-3e05-8be7-96945ed2088d"
    description: "It's an easy mistake to think of the Moon as a simple accessory to our planet, but the Earth and Moon are a close-knit pair, and the Moon influences everything from our tides to our magnetic fields to the brightness of our nights. All life on Earth has evolved in the presence of the Moon, and so life on Earth can't be fully understood without considering our cosmic companion. In this episode, we discuss how the Moon influences life past and present, and what we know about the deep history of the Earth-Moon relationship.\nIn the news: pterosaur colors, a glowing spider, deformed pollen, and a long-toed tetrapod.\nTime markers:\nIntro & Announcements: 00:00:00\nNews: 00:04:00\nMain discussion, Part 1: 00:36:30\nMain discussion, Part 2: 01:16:30\nPatron question: 01:55:00\nCheck out our blog for bonus info and pictures:\nhttp://commondescentpodcast.wordpress.com/\nJoin us on Patreon to support the podcast and enjoy bonus content! https://www.patreon.com/commondescentpodcast\nOr make a one-time donation via PayPal: https://tinyurl.com/4c68u4hp\nFind merch at the Common Descent Store! http://zazzle.com/common_descent\nJoin the Common Descent Discord server! https://discord.gg/CwPBxdh9Ev\nFollow and Support us on:\nTwitter: https://twitter.com/CommonDescentPC\nFacebook: https://www.facebook.com/commondescentpodcast\nInstagram: @commondescentpodcast\nYouTube: https://www.youtube.com/channel/UCePRXHEnZmTGum2r1l2mduw\nPodBean: https://commondescentpodcast.podbean.com/\niTunes: https://itunes.apple.com/us/podcast/the-common-descent-podcast/id1207586509?mt=2\nYou can email us at commondescentpodcast(at)gmail.com\nOr send us physical mail at:\nThe Common Descent Podcast\n1735 W State of Franklin Rd. Ste 5 #165\nJohnson City, TN 37604\nThe Intro and Outro music is “On the Origin of Species” by Protodome.\nMore music like this at http://ocremix.org.\nMusical Interludes are \"Professor Umlaut\" by Kevin MacLeod (incompetech.com). Licensed under Creative Commons: 