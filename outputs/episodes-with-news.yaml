  - episode_number: "164"
    rss_episode_number: "237"
    title: "The ”Boring Billion”"
    original_title: "Episode 164 - The ”Boring Billion”"
    date: "2023-04-29"
    published_raw: "Sat, 29 Apr 2023 19:00:00 -0500"
    type: "Main"
    rss_episode_type: "full"
    page_url: "https://commondescentpodcast.podbean.com/e/episode-164-the-boring-billion/"
    audio_url: "https://mcdn.podbean.com/mf/web/8hvj5w/Episode_164_The_Boring_Billion.mp3"
    guid: "commondescentpodcast.podbean.com/f555a2e7-bf34-3f77-8855-04dc701cbd32"
    description: "From roughly 1.8 – 0.8 billion years ago, things on Earth seemingly slowed down. The geologic record shows a conspicuous lack of evidence for major climatic, tectonic, or biological changes, a dramatic contrast to the tumultuous times before and after. In this episode, we explore this so-called “Boring Billion” and discuss what made it so unusual. Along the way, we’ll examine claims that there might have been more going on than we think, that this time might have been a critical step toward the modern state of our planet, and that this billion might not have been so boring after all.\nIn the news: oldest bats, sauropod skulls, placoderm mouths, and feather-eating beetles.\nTime markers:\nIntro & Announcements: 00:00:00\nNews: 00:05:45\nMain discussion, Part 1: 00:39:00\nMain discussion, Part 2: 01:08:15\nPatron question: 01:40:30\nListen to us on I Know Dino!\nhttps://iknowdino.com/sinotyrannus-episode-437/\nWill was a guest on Sprites of Life!\nhttps://open.spotify.com/episode/7KmiNQcKWgpT6Nn0FRrMMp\nCheck out our blog for bonus info and pictures:\nhttp://commondescentpodcast.com/\nJoin us on Patreon to support the podcast and enjoy bonus content! https://www.patreon.com/commondescentpodcast\nFollow this link for a 30-day free trial to Audible!\nwww.audibletrial.com/CommonDescent\nOr make a one-time donation via PayPal: https://tinyurl.com/4c68u4hp\nFind merch at the Common Descent Store! http://zazzle.com/common_descent\nJoin the Common Descent Discord server! https://discord.gg/CwPBxdh9Ev\nFollow and Support us on:\nTwitter: https://twitter.com/CommonDescentPC\nFacebook: https://www.facebook.com/commondescentpodcast\nInstagram: @commondescentpodcast\nYouTube: https://www.youtube.com/channel/UCePRXHEnZmTGum2r1l2mduw\nPodBean: https://commondescentpodcast.podbean.com/\niTunes: https://itunes.apple.com/us/podcast/the-common-descent-podcast/id1207586509?mt=2\nYou can email us at commondescentpodcast(at)gmail.com\nOr send us physical mail at:\nThe Co