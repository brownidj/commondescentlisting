    type: "Main"
    rss_episode_type: "full"
    page_url: "https://commondescentpodcast.podbean.com/e/episode-255-plant-origins/"
    audio_url: "https://mcdn.podbean.com/mf/web/qbsapsif4zkaeqbn/Episode_255_Plant_Origins.mp3"
    guid: "commondescentpodcast.podbean.com/6d9f44a3-05e4-3ca2-b8e8-32426a95678e"
    description: "Here on our blue-and-green planet, the green is plants. This episode, Aly joins us again to explore the beginnings of this all-important group of life. We’ll discuss which ancestors gave rise to true plants, what the fossil record tells us about the timing of this momentous event, and the array of key adaptations that allowed plants to join their fungus and animal cousins up on dry land.\nIn the news: mosasaurs, more mosasaurs, Jurassic mammals, and horned dinosaurs.\nTime Markers:\nIntro & Announcements: 00:00:00\nNews: 00:05:25\nMain discussion, Part 1: 00:47:35\nMain discussion, Part 2: 01:16:05\nPatron question: 02:05:35\nJoin us on Patreon to support the podcast and enjoy bonus content: https://www.patreon.com/commondescentpodcast\nCheck out our website for this episode’s blog post and more: http://commondescentpodcast.com/\nGot a topic you want to hear about? Submit your episode request here: https://commondescentpodcast.com/request-a-topic/\nLots more ways to connect with us: https://linktr.ee/common_descent\nThe Intro and Outro music is “On the Origin of Species” by Protodome. More music like this at http://ocremix.org\nMusical Interludes are \"Professor Umlaut\" by Kevin MacLeod (incompetech.com). Licensed under Creative Commons: By Attribution 3.0 http://creativecommons.org/licenses/by/3.0"
    news:
      start_time: "00:05:25"
      summary: "mosasaurs, more mosasaurs, Jurassic mammals, and horned dinosaurs."
