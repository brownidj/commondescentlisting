    title: "Behavior in the Fossil Record"
    original_title: "Episode 61 - Behavior in the Fossil Record"
    date: "2019-05-18"
    published_raw: "Sat, 18 May 2019 20:30:00 -0500"
    type: "Main"
    rss_episode_type: "full"
    page_url: "https://commondescentpodcast.podbean.com/e/episode-61-behavior-in-the-fossil-record/"
    audio_url: "https://mcdn.podbean.com/mf/web/qh6pgg/Episode_61_-_Behavior_in_the_Fossil_Record.mp3"
    guid: "commondescentpodcast.podbean.com/episode-61-behavior-in-the-fossil-record-fccdae8da9273c7902f3fca9deafb4c7"
    description: "It’s easy to see how fossils can teach us what ancient animals looked like, or how they evolved. But what about the ways they moved, ate, socialized, reproduced? In this episode, we explore the innovative ways paleontologists have devised to interpret the behavior of ancient animals. From their bones, their tracks, their living relatives, and modern clever experimentation, we can come to understand more than you’d ever imagine about behavior in the fossil record.\nIn the news: a Denisovan jaw, a new bat-winged dinosaur, a cave of wonders, and a flapping robot.\nTime markers:\nIntro & Announcements: 00:00:00\nNews: 00:05:30\nMain discussion, Part 1: 00:32:30\nMain discussion, Part 2: 01:07:30\nPatron question: 01:41:30\nThe Common Descent Store is open! Get merch! http://zazzle.com/common_descent\nHow do you become a paleontologist? A GREAT post by our friends at Time Scavengers!\nhttps://timescavengers.blog/2019/05/13/how-do-you-become-a-paleontologist/\nCheck out our blog for bonus info and pictures:\nhttp://commondescentpodcast.wordpress.com/\nFollow and Support us on:\nPatreon: https://www.patreon.com/commondescentpodcast\nTwitter: https://twitter.com/CommonDescentPC\nFacebook: https://www.facebook.com/commondescentpodcast/\nPodBean: https://commondescentpodcast.podbean.com/\niTunes: https://itunes.apple.com/us/podcast/the-common-descent-podcast/id1207586509?mt=2\nYouTube: https://www.youtube.com/channel/UCePRXHEnZmTGum2r1l2mduw\nThe Intro and Outro music is “On the Origin of Species” by Protodome.\nMore music like this at http://ocremix.org.\nMuscial Interludes are \"Professor Umlaut\" by Kevin MacLeod (incompetech.com). Licensed under Creative Commons: By Attribution 3.0\nhttp://creativecommons.org/licenses/by/3.0/"
