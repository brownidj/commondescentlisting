    title: "Fins to Feet: The Fish-Tetrapod Transition"
    original_title: "Episode 77 - Fins to Feet: The Fish-Tetrapod Transition"
    date: "2019-12-28"
    published_raw: "Sat, 28 Dec 2019 20:44:11 -0500"
    type: "Main"
    rss_episode_type: "full"
    page_url: "https://commondescentpodcast.podbean.com/e/episode-77-fins-to-feet-the-fish-tetrapod-transition/"
    audio_url: "https://mcdn.podbean.com/mf/web/e5p4i3/Episode_77_-_Fins_to_Feet_The_Fish-Tetrapod_Transition.mp3"
    guid: "commondescentpodcast.podbean.com/1d354711-bb88-5cba-a567-a7a193e1113d"
    description: "Happy New Year!\nAs we transition into a new decade, this episode is about one of the most important and incredible transitions in the evolutionary history of life. In the Late Devonian, one particular group of bony fish spent many millions of years experimenting with new forms of fins, skulls, and lifestyles, ultimately giving rise to the first land-dwelling vertebrates and setting the stage for 300 million years of continental dominance.\nIn the news: the earliest penguins, ancient whale swimming, dinosaur lice, and really old brains.\nTime markers:\nIntro & Announcements: 00:00:00\nNews: 00:04:00\nMain discussion, Part 1: 00:30:30\nMain discussion, Part 2: 00:59:00\nCheck out our blog for bonus info and pictures:\nhttp://commondescentpodcast.wordpress.com/\nThe Common Descent Store is open! Get merch! http://zazzle.com/common_descent\nFollow and Support us on:\nPatreon: https://www.patreon.com/commondescentpodcast\nTwitter: https://twitter.com/CommonDescentPC\nFacebook: https://www.facebook.com/commondescentpodcast/\nPodBean: https://commondescentpodcast.podbean.com/\niTunes: https://itunes.apple.com/us/podcast/the-common-descent-podcast/id1207586509?mt=2\nYouTube: https://www.youtube.com/channel/UCePRXHEnZmTGum2r1l2mduw\nThe Intro and Outro music is “On the Origin of Species” by Protodome.\nMore music like this at http://ocremix.org.\nMusical Interludes are \"Professor Umlaut\" by Kevin MacLeod (incompetech.com). Licensed under Creative Commons: By Attribution 3.0\nhttp://creativecommons.org/licenses/by/3.0/"
