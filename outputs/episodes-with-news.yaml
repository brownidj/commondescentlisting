    rss_episode_number: "173"
    title: "Trace Fossils"
    original_title: "Episode 118 - Trace Fossils"
    date: "2021-07-24"
    published_raw: "Sat, 24 Jul 2021 19:33:19 -0500"
    type: "Main"
    rss_episode_type: "full"
    page_url: "https://commondescentpodcast.podbean.com/e/episode-118-trace-fossils/"
    audio_url: "https://mcdn.podbean.com/mf/web/cirieg/Episode_118_Trace_Fossils.mp3"
    guid: "commondescentpodcast.podbean.com/7af7f36c-fafd-3d1b-9603-ab862ca65493"
    description: "As organisms live, grow, and move in their environments, they leave all sorts of traces in their surroundings, and these can become fossilized just like body parts can. Trace fossils (ichnofossils) can include evidence of burrowing, walking, feeding, and more. Individual trace fossils are great for understanding the behaviors of ancient organisms, and communities of trace fossils can help us track major changes in ecosystems through time.\nIn the news: damaged cave bear, shrinking dinosaurs, koala lemurs, and megaripples.\nTime markers:\nIntro & Announcements: 00:00:00\nNews: 00:05:30\nMain discussion, Part 1: 00:35:30\nMain discussion, Part 2: 01:11:30\nPatron question: 01:55:00\nWe're on a new podcast! We're both players on Mysteries of the Mournland, a Level Up: Advanced Fifth Edition actual play horror podcast, set in the world of Eberron.\nhttps://motma5epodcast.podbean.com/\nCheck out our blog for bonus info and pictures:\nhttp://commondescentpodcast.wordpress.com/\nFind merch at the Common Descent Store! http://zazzle.com/common_descent\nFollow and Support us on:\nPatreon: https://www.patreon.com/commondescentpodcast\nTwitter: https://twitter.com/CommonDescentPC\nFacebook: https://www.facebook.com/commondescentpodcast\nInstagram: @commondescentpodcast\nYouTube: https://www.youtube.com/channel/UCePRXHEnZmTGum2r1l2mduw\nPodBean: https://commondescentpodcast.podbean.com/\niTunes: https://itunes.apple.com/us/podcast/the-common-descent-podcast/id1207586509?mt=2\nThe Intro and Outro music is “On the Origin of Species” by Protodome.\nMore music like this at http://ocremix.org.\nMusical Interludes are \"Professor Umlaut\" by Kevin MacLeod (incompetech.com). Licensed under Creative Commons: By Attribution 3.0\nhttp://creativecommons.org/licenses/by/3.0/"
