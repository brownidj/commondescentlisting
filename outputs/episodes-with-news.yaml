    title: "Therizinosaurs"
    original_title: "Episode 207 - Therizinosaurs"
    date: "2024-12-21"
    published_raw: "Sat, 21 Dec 2024 20:00:00 -0500"
    type: "Main"
    rss_episode_type: "full"
    page_url: "https://commondescentpodcast.podbean.com/e/episode-207-therizinosaurs/"
    audio_url: "https://mcdn.podbean.com/mf/web/w66m7p2ies9pqfvw/Episode_207_Therizinosaurs.mp3"
    guid: "commondescentpodcast.podbean.com/b28188b9-3996-377f-91f1-90c2dc38c631"
    description: "Most theropod dinosaurs are sleek predators built for speedy movement and efficient hunting. Therizinosaurs are unusual. They’re slow and stocky and, in many ways, more like the famous plant-eating dinosaurs. This episode, we’ll explore the diversity of therizinosaurs, the winding path that paleontologists took to understand them, the many ways they became specialized for a diet of plants, and what was going on with those claws.\nIn the news: Parasaurolophus crests, Scottish bears, anglerfish evolution, and Clovis diets.\nTime markers:\nIntro & Announcements: 00:00:00\nNews: 00:07:30\nMain discussion, Part 1: 00:46:45\nMain discussion, Part 2: 01:14:20\nPatron question: 02:00:30\nCheck out our website for this episode’s blog post and more: http://commondescentpodcast.com/\nJoin us on Patreon to support the podcast and enjoy bonus content: https://www.patreon.com/commondescentpodcast\nGot a topic you want to hear about? Submit your episode request here: https://commondescentpodcast.com/request-a-topic/\nLots more ways to connect with us: https://linktr.ee/common_descent\nThe Intro and Outro music is “On the Origin of Species” by Protodome. More music like this at http://ocremix.org\nMusical Interludes are \"Professor Umlaut\" by Kevin MacLeod (incompetech.com). Licensed under Creative Commons: By Attribution 3.0 http://creativecommons.org/licenses/by/3.0"
