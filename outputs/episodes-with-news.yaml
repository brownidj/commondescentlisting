  - episode_number: "78"
    rss_episode_number: "114"
    title: "Exaptation"
    original_title: "Episode 78 - Exaptation"
    date: "2020-01-11"
    published_raw: "Sat, 11 Jan 2020 21:05:46 -0500"
    type: "Main"
    rss_episode_type: "full"
    page_url: "https://commondescentpodcast.podbean.com/e/episode-78-exaptation/"
    audio_url: "https://mcdn.podbean.com/mf/web/hfv83i/Episode_78_-_Exaptation.mp3"
    guid: "commondescentpodcast.podbean.com/a395c1f9-b4ef-517b-a8be-0e34af39afaa"
    description: "Hand a kitchen appliance to a child and they’re likely to find a whole new way to use it. This happens in evolution, too – traits adapted for one purpose turn out to be beneficial for a whole other reason, and so the trajectory of natural selection changes. The term for this is exaptation, but it’s a complicated concept, and not everyone even likes using the word. Let’s discuss what this word means, why it exists, and what some people find wrong with it.\nIn the news: the oldest forest, an ancient parent, young T. rex, and fossil lungfish.\nTime markers:\nIntro & Announcements: 00:00:00\nNews: 00:04:30\nMain discussion, Part 1: 00:35:30\nMain discussion, Part 2: 01:00:00\nCheck out our blog for bonus info and pictures:\nhttp://commondescentpodcast.wordpress.com/\nThe Common Descent Store is open! Get merch! http://zazzle.com/common_descent\nFollow and Support us on:\nPatreon: https://www.patreon.com/commondescentpodcast\nTwitter: https://twitter.com/CommonDescentPC\nFacebook: https://www.facebook.com/commondescentpodcast/\nPodBean: https://commondescentpodcast.podbean.com/\niTunes: https://itunes.apple.com/us/podcast/the-common-descent-podcast/id1207586509?mt=2\nYouTube: https://www.youtube.com/channel/UCePRXHEnZmTGum2r1l2mduw\nThe Intro and Outro music is “On the Origin of Species” by Protodome.\nMore music like this at http://ocremix.org.\nMusical Interludes are \"Professor Umlaut\" by Kevin MacLeod (incompetech.com). Licensed under Creative Commons: By Attribution 3.0\nhttp://creativecommons.org/licenses/by/3.0/"
