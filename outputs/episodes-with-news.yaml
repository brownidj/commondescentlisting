    guid: "commondescentpodcast.podbean.com/ae146453-638a-32d4-9df1-eb5409637d68"
    description: "Forests are among the most widespread and diverse biomes on our planet. This episode, we’re joined by our favorite paleobotanist, Dr. Aly Baumgartner, to explore what defines a forest, how these habitats function, and how they differ around the globe. Then, we’ll take a trip into the past to discuss how paleontologists study ancient forests and how these biomes have changed over hundreds of millions of years.\nIn the news: ocean sediments, early penguins, island foxes, Canadian dragonflies, and ancient deer.\nTime markers:\nIntro & Announcements: 00:00:00\nNews: 00:06:00\nMain discussion, Part 1: 00:37:30\nMain discussion, Part 2: 01:47:10\nPatron question: 02:48:35\nCheck out our website for this episode’s blog post and more: http://commondescentpodcast.com/\nListen to more Plants with Aly on Leaf it to Us!\nhttps://commondescentpodcast.com/leaf-it-to-us/\nJoin us on Patreon to support the podcast and enjoy bonus content: https://www.patreon.com/commondescentpodcast\nSubscribe to Curiosity Box using our Affiliate Link: https://www.curiositybox.com/CommonDescent\nAnd get 25% off the first box with code descent25\nGot a topic you want to hear about? Submit your episode request here: https://commondescentpodcast.com/request-a-topic/\nLots more ways to connect with us: https://linktr.ee/common_descent\nThe Intro and Outro music is “On the Origin of Species” by Protodome. More music like this at http://ocremix.org\nMusical Interludes are \"Professor Umlaut\" by Kevin MacLeod (incompetech.com). Licensed under Creative Commons: By Attribution 3.0 http://creativecommons.org/licenses/by/3.0"
