    guid: "commondescentpodcast.podbean.com/86f192ac-d475-5b96-a517-3f800cf71565"
    description: "The first pterosaur to be scientifically identified was Pterodactylus, more than 200 years ago. Since then, scientists have grappled with understanding these bizarre and fantastic animals, aided by inspired science and incredible discoveries. In this episode, we’ll discuss what we know – and what we don’t know – about how these animals evolved, survived, and ruled the skies in the Age of Reptiles.\nIn the news: cassowary evolution, the oldest scorpions, sea floor taphonomy, and Neanderthal shells.\nTime markers:\nIntro & Announcements: 00:00:00\nNews: 00:08:30\nMain discussion, Part 1: 00:38:30\nMain discussion, Part 2: 01:22:00\nPatron question: 02:10:00\nWe’ve donated our December 2019 Patreon earnings to WIRES to help with wildlife recovery in Australia. Learn more here: https://www.wires.org.au/\nCheck out our blog for bonus info and pictures:\nhttp://commondescentpodcast.wordpress.com/\nThe Common Descent Store is open! Get merch! http://zazzle.com/common_descent\nFollow and Support us on:\nPatreon: https://www.patreon.com/commondescentpodcast\nTwitter: https://twitter.com/CommonDescentPC\nFacebook: https://www.facebook.com/commondescentpodcast/\nPodBean: https://commondescentpodcast.podbean.com/\niTunes: https://itunes.apple.com/us/podcast/the-common-descent-podcast/id1207586509?mt=2\nYouTube: https://www.youtube.com/channel/UCePRXHEnZmTGum2r1l2mduw\nThe Intro and Outro music is “On the Origin of Species” by Protodome.\nMore music like this at http://ocremix.org.\nMusical Interludes are \"Professor Umlaut\" by Kevin MacLeod (incompetech.com). Licensed under Creative Commons: By Attribution 3.0\nhttp://creativecommons.org/licenses/by/3.0/"
