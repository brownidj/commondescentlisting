    guid: "commondescentpodcast.podbean.com/episode-39-speculative-evolution-63dcc44960d68c7f73991f31636abc6a"
    description: "This episode, we’re discussing the fun and fascinating “What If” thought experiments of evolution. From fantastical fictional stories to unusual scientific hypotheses to just-for-fun artistic creations, speculative evolution is all about exploring the unseen (and maybe never-to-be-seen) possibilities of real biological science. We’ll touch on some of our favorite “hard science fiction” as well as how this style of creative thinking can contribute to the study of real living creatures of the past ... and beyond.\nIn the news: Native American dogs, Neanderthal hunting methods, mammal testicle evolution, and plant-induced insect development.\nTime markers:\nIntro & Announcements: 00:00:00\nNews: 00:04:30\nMain discussion, Part 1: 00:36:00\nMain discussion, Part 2: 01:15:00\nCheck out our blog for bonus info and pictures:\nhttp://commondescentpodcast.wordpress.com/\nFollow and Support us on:\nPatreon: https://www.patreon.com/commondescentpodcast\nTwitter: https://twitter.com/CommonDescentPC\nFacebook: https://www.facebook.com/commondescentpodcast/\nPodBean: https://commondescentpodcast.podbean.com/\niTunes: https://itunes.apple.com/us/podcast/the-common-descent-podcast/id1207586509?mt=2\nYouTube: https://www.youtube.com/channel/UCePRXHEnZmTGum2r1l2mduw\nThe Intro and Outro music is “On the Origin of Species” by Protodome.\nMore music like this at http://ocremix.org.\nMuscial Interludes are \"Professor Umlaut\" by Kevin MacLeod (incompetech.com). Licensed under Creative Commons: By Attribution 3.0\nhttp://creativecommons.org/licenses/by/3.0/"
