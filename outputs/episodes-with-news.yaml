    title: "Plant Defenses"
    original_title: "Episode 175 - Plant Defenses"
    date: "2023-09-30"
    published_raw: "Sat, 30 Sep 2023 19:00:00 -0500"
    type: "Main"
    rss_episode_type: "full"
    page_url: "https://commondescentpodcast.podbean.com/e/episode-175-plant-defenses/"
    audio_url: "https://mcdn.podbean.com/mf/web/e69qp8/Episode_175_Plant_Defenses.mp3"
    guid: "commondescentpodcast.podbean.com/b39ac15e-9679-396c-9590-30092731fc49"
    description: "Plants are delicious, nutritious, and full of energy, so they’re prime targets for all sorts of herbivores, parasites, and pathogens. But plants aren’t just sitting passively accepting attacks, they use a variety of strategies to defend themselves, from the frustrating to the fatal. This episode, we’re joined by our favorite paleobotanist, Aly Baumgartner, to discuss the many ways plants defend themselves – physically, chemically, and beyond – and the fascinating evolutionary history of plant defenses and their offenders.\nIn the news: deep-sea fish, Wollemi pines, learning birds, and plant technology.\nTime markers:\nIntro & Announcements: 00:00:00\nNews: 00:06:55\nMain discussion, Part 1: 00:38:15\nMain discussion, Part 2: 01:12:25\nPatron question: 01:48:10\nCheck out our blog for bonus info and pictures:\nhttp://commondescentpodcast.com/\nJoin us on Patreon to support the podcast and enjoy bonus content! https://www.patreon.com/commondescentpodcast\nGot a topic you want to hear about? Submit your episode request here:\nhttps://commondescentpodcast.com/request-a-topic/\nWe’re an Audible Affiliate Partner! Use this link for a 30-day free trial to Audible: https://www.audibletrial.com/CommonDescent\nOr make a one-time donation via PayPal: https://tinyurl.com/4c68u4hp\nFind merch at the Common Descent Store! http://zazzle.com/common_descent\nJoin the Common Descent Discord server! https://discord.gg/CwPBxdh9Ev\nFollow and Support us on:\nTwitter: https://twitter.com/CommonDescentPC\nFacebook: https://www.facebook.com/commondescentpodcast\nInstagram: https://www.instagram.com/commondescentpodcast/\nYouTube: https://www.youtube.com/channel/UCePRXHEnZmTGum2r1l2mduw\nPodBean: https://commondescentpodcast.podbean.com/\nYou can email us at commondescentpodcast(at)gmail.com\nOr send us physical mail at:\nThe Common Descent Podcast\n1735 W State of Franklin Rd. Ste 5 #165\nJohnson City, TN 37604\nThe Intro and Outro music is “On the Origin of Species” by P