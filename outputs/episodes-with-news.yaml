    page_url: "https://commondescentpodcast.podbean.com/e/episode-206-vestigial-structures/"
    audio_url: "https://mcdn.podbean.com/mf/web/pczcfqbzb9amybdt/Episode_206_Vestigial_Structures.mp3"
    guid: "commondescentpodcast.podbean.com/bb475270-0c06-3897-bd5c-abb74dfd91e2"
    description: "Evolution involves the innovation of new features, but even more reduction of old features. Those reduced features might disappear, develop in a new direction, or just linger as a functionless evidence of deep ancestry. This episode, we explore how we identify vestigial traits, how they help us understand evolutionary history, and the various evolutionary paths vestigial structures can take.\nIn the news: giant worm lizards, drumstick evolution, dinosaur poop, and pterosaur transitions.\nTime markers:\nIntro & Announcements: 00:00:00\nNews: 00:04:00\nMain discussion, Part 1: 00:36:45\nMain discussion, Part 2: 01:22:30\nPatron question: 01:56:50\nCheck out our website for this episode’s blog post and more: http://commondescentpodcast.com/\nJoin us on Patreon to support the podcast and enjoy bonus content: https://www.patreon.com/commondescentpodcast\nGot a topic you want to hear about? Submit your episode request here: https://commondescentpodcast.com/request-a-topic/\nLots more ways to connect with us: https://linktr.ee/common_descent\nThe Intro and Outro music is “On the Origin of Species” by Protodome. More music like this at http://ocremix.org\nMusical Interludes are \"Professor Umlaut\" by Kevin MacLeod (incompetech.com). Licensed under Creative Commons: By Attribution 3.0 http://creativecommons.org/licenses/by/3.0"
