    rss_episode_type: "full"
    page_url: "https://commondescentpodcast.podbean.com/e/episode-47-early-synapsids-proto-mammals/"
    audio_url: "https://mcdn.podbean.com/mf/web/mwi7vc/Episode_47_-_Early_Synapsids.mp3"
    guid: "commondescentpodcast.podbean.com/episode-47-early-synapsids-proto-mammals-88ed7baaa7d480d52ac9e94c83100253"
    description: "Synapsids are a vast group of animals that includes only one living lineage: us mammals. But for about 100 million years before true mammals evolved, ancient synapsids were not only incredibly diverse, but dominant in ecosystems around the world. In this episode, we’ll explore some of this incredible variety of “proto-mammals” and track the long evolutionary transition that produced all the familiar traits that make us mammalian.\nIn the news: a new living croc, a carnivorous herbivorous dinosaur, strange old footprints, and fish origins.\nTime markers:\nIntro & Announcements: 00:00:00\nNews: 00:04:30\nMain discussion, Part 1: 00:34:00\nMain discussion, Part 2: 01:02:30\nCheck out our blog for bonus info and pictures:\nhttp://commondescentpodcast.wordpress.com/\nFollow and Support us on:\nPatreon: https://www.patreon.com/commondescentpodcast\nTwitter: https://twitter.com/CommonDescentPC\nFacebook: https://www.facebook.com/commondescentpodcast/\nPodBean: https://commondescentpodcast.podbean.com/\niTunes: https://itunes.apple.com/us/podcast/the-common-descent-podcast/id1207586509?mt=2\nYouTube: https://www.youtube.com/channel/UCePRXHEnZmTGum2r1l2mduw\nThe Intro and Outro music is “On the Origin of Species” by Protodome.\nMore music like this at http://ocremix.org.\nMuscial Interludes are \"Professor Umlaut\" by Kevin MacLeod (incompetech.com). Licensed under Creative Commons: By Attribution 3.0\nhttp://creativecommons.org/licenses/by/3.0/"
