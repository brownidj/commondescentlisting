    rss_episode_number: "212"
    title: "Photosynthesis"
    original_title: "Episode 145 - Photosynthesis"
    date: "2022-08-06"
    published_raw: "Sat, 06 Aug 2022 19:51:15 -0500"
    type: "Main"
    rss_episode_type: "full"
    page_url: "https://commondescentpodcast.podbean.com/e/episode-145-photosynthesis/"
    audio_url: "https://mcdn.podbean.com/mf/web/u7bye2/Episode_145_Photosynthesis.mp3"
    guid: "commondescentpodcast.podbean.com/24205c6a-adc6-3b07-b8ff-3ff34db9a3a1"
    description: "We live in a solar-powered world. Photosynthesis is the process by which some organisms (notably plants and cyanobacteria) harness the energy of sunlight to power their own metabolism, in the process creating the sugars (food) which provide a source of energy for all sorts of other organisms, not to mention releasing oxygen as well. Photosynthesis is the reason our planet is the way it is, from the diversity of life to the composition of the atmosphere. In this episode, we discuss the diversity of photosynthesis and photosynthesizers, what we know about the evolutionary history of the process, and how it has profoundly changed the world.\nIn the news: freshwater plesiosaurs, endothermy evolution, whale shark diets, and bone-crushing dogs.\nTime markers:\nIntro & Announcements: 00:00:00\nNews: 00:08:30\nMain discussion, Part 1: 00:43:30\nMain discussion, Part 2: 01:45:30\nPatron question: 02:31:00\nPlease forgive our mismatched audio in the Intro and News sections.\nWe recently appeared on the Juras-Sick-Park-Cast!\nhttps://jurassickparkcast.blogspot.com/2022/07/episode-20-when-dinosaurs-ruled-earth.html\nCheck out our blog for bonus info and pictures:\nhttp://commondescentpodcast.wordpress.com/\nJoin us on Patreon to support the podcast and enjoy bonus content! https://www.patreon.com/commondescentpodcast\nOr make a one-time donation via PayPal: https://tinyurl.com/4c68u4hp\nFind merch at the Common Descent Store! http://zazzle.com/common_descent\nJoin the Common Descent Discord server! https://discord.gg/CwPBxdh9Ev\nFollow and Support us on:\nTwitter: https://twitter.com/CommonDescentPC\nFacebook: https://www.facebook.com/commondescentpodcast\nInstagram: @commondescentpodcast\nYouTube: https://www.youtube.com/channel/UCePRXHEnZmTGum2r1l2mduw\nPodBean: https://commondescentpodcast.podbean.com/\niTunes: https://itunes.apple.com/us/podcast/the-common-descent-podcast/id1207586509?mt=2\nYou can email us at commondescentpodcast(at)gmail.com\nOr send us 