  - episode_number: "133"
    rss_episode_number: "194"
    title: "Symbiosis"
    original_title: "Episode 133 - Symbiosis"
    date: "2022-02-19"
    published_raw: "Sat, 19 Feb 2022 20:00:00 -0500"
    type: "Main"
    rss_episode_type: "full"
    page_url: "https://commondescentpodcast.podbean.com/e/episode-133-symbiosis/"
    audio_url: "https://mcdn.podbean.com/mf/web/gg744v/Episode_133_Symbiosis.mp3"
    guid: "commondescentpodcast.podbean.com/7dcce467-db12-316e-bd78-d21d80fd5549"
    description: "None of us are alone. Like, in the literal, biological sense. Symbiotic relationships – close interactions between unrelated organisms – are a defining feature of life on Earth. Each of our bodies has its own share of parasites, hitchhikers, and tiny helpers, and some of the most prominent ecosystems on Earth function only by virtue of the symbiotic relationships at their foundations. In this episode, we touch on the incredible diversity and impact of symbiosis, and how the deep history of these relationships has created the world we know today.\nIn the news: sick sauropods, puking pterosaurs, jumping genes in snakes, and dino-eating crocs.\nTime markers:\nIntro & Announcements: 00:00:00\nNews: 00:05:00\nMain discussion, Part 1: 00:39:30\nMain discussion, Part 2: 01:24:30\nPatron question: 02:05:30\nCheck out our blog for bonus info and pictures:\nhttp://commondescentpodcast.wordpress.com/\nJoin us on Patreon to support the podcast and enjoy bonus content! https://www.patreon.com/commondescentpodcast\nOr make a one-time donation via PayPal: https://tinyurl.com/4c68u4hp\nFind merch at the Common Descent Store! http://zazzle.com/common_descent\nJoin the Common Descent Discord server! https://discord.gg/CwPBxdh9Ev\nFollow and Support us on:\nTwitter: https://twitter.com/CommonDescentPC\nFacebook: https://www.facebook.com/commondescentpodcast\nInstagram: @commondescentpodcast\nYouTube: https://www.youtube.com/channel/UCePRXHEnZmTGum2r1l2mduw\nPodBean: https://commondescentpodcast.podbean.com/\niTunes: https://itunes.apple.com/us/podcast/the-common-descent-podcast/id1207586509?mt=2\nYou can email us at commondescentpodcast(at)gmail.com\nOr send us physical mail at:\nThe Common Descent Podcast\n1735 W State of Franklin Rd. Ste 5 #165\nJohnson City, TN 37604\nThe Intro and Outro music is “On the Origin of Species” by Protodome.\nMore music like this at http://ocremix.org.\nMusical Interludes are \"Professor Umlaut\" by Kevin MacLeod (incompetech.com). Lic