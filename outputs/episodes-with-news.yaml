  - episode_number: "181"
    rss_episode_number: "263"
    title: "Dragonflies"
    original_title: "Episode 181 - Dragonflies"
    date: "2023-12-23"
    published_raw: "Sat, 23 Dec 2023 19:00:00 -0500"
    type: "Main"
    rss_episode_type: "full"
    page_url: "https://commondescentpodcast.podbean.com/e/episode-181-dragonflies/"
    audio_url: "https://mcdn.podbean.com/mf/web/g8p5hw/Episode_181_Dragonflies.mp3"
    guid: "commondescentpodcast.podbean.com/8b991257-a07c-342d-b9ee-da243a2fa140"
    description: "Dragonflies and damselflies are incredible insects. They are arguably the world’s most skilled fliers, arguably the world’s most successful predators, and arguably the best insects (so says David). Not only that, they and their ancient cousins have been abundant and successful aerial predators for over 300 million years. This episode, we discuss what sets these bugs apart from all the rest, we explore what’s known of their evolution from their surprisingly good fossil record, and of course we highlight their most famous extinct cousins: the giant griffenflies.\nIn the news: croc habitats, tyrannosaur food, elephant trunks, and early mosquitos.\nTime markers:\nIntro & Announcements: 00:00:00\nNews: 00:04:30\nMain discussion, Part 1: 00:34:15\nMain discussion, Part 2: 01:13:15\nPatron question: 01:53:45\nCheck out our website for this episode’s blog post and more:\nhttp://commondescentpodcast.com/\nJoin us on Patreon to support the podcast and enjoy bonus content: https://www.patreon.com/commondescentpodcast\nGot a topic you want to hear about? Submit your episode request here:\nhttps://commondescentpodcast.com/request-a-topic/\nWe’re an Audible Affiliate Partner! Use this link for a 30-day free trial to Audible: https://www.audibletrial.com/CommonDescent\nLots more ways to connect with us: https://linktr.ee/common_descent\nThe Intro and Outro music is “On the Origin of Species” by Protodome.\nMore music like this at http://ocremix.org.\nMusical Interludes are \"Professor Umlaut\" by Kevin MacLeod (incompetech.com). Licensed under Creative Commons: By Attribution 3.0\nhttp://creativecommons.org/licenses/by/3.0/"
