    guid: "commondescentpodcast.podbean.com/8f3b8da1-fb17-3192-b5d3-cacb748b7492"
    description: "For over 100 million years, North America and Asia have been connected over the Pacific Ocean through a region called Beringia. The comings and going of plants and animals across this connection have shaped ecosystems of the past and present. This episode, we explore the geologic history of the region and which ancient species have managed to live in and move through Beringia.\nIn the news: early sperm whales, BC plesiosaurs, megatooth shark food, and Arctic nesting birds.\nTime markers:\nIntro & Announcements: 00:00:00\nNews: 00:09:10\nMain discussion, Part 1: 00:35:25\nMain discussion, Part 2: 01:02:15\nPatron question: 01:40:40\nCheck out our website for this episode’s blog post and more: http://commondescentpodcast.com/\nJoin us on Patreon to support the podcast and enjoy bonus content: https://www.patreon.com/commondescentpodcast\nSome LGBTQIA+ organizations in the southeast US:\nTrans Aid Nashville: https://www.transaidnashville.org/\nOut Memphis: https://www.outmemphis.org/\nSoutherners on New Ground: https://southernersonnewground.org\nShoutout to Vic Michaelis for these links: www.instagram.com/vicmmic/\nGot a topic you want to hear about? Submit your episode request here: https://commondescentpodcast.com/request-a-topic/\nLots more ways to connect with us: https://linktr.ee/common_descent\nThe Intro and Outro music is “On the Origin of Species” by Protodome. More music like this at http://ocremix.org\nMusical Interludes are \"Professor Umlaut\" by Kevin MacLeod (incompetech.com). Licensed under Creative Commons: By Attribution 3.0 http://creativecommons.org/licenses/by/3.0"
