    title: "Paleopathology"
    original_title: "Episode 84 - Paleopathology"
    date: "2020-04-04"
    published_raw: "Sat, 04 Apr 2020 21:00:00 -0500"
    type: "Main"
    rss_episode_type: "full"
    page_url: "https://commondescentpodcast.podbean.com/e/episode-84-paleopathology/"
