    title: "Mazon Creek Fossil Beds"
    original_title: "Episode 110 - Mazon Creek Fossil Beds"
    date: "2021-04-03"
    published_raw: "Sat, 03 Apr 2021 19:04:33 -0500"
    type: "Main"
