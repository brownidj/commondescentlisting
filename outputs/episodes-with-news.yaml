    title: "The Ice Age"
    original_title: "Episode 252 - The Ice Age"
    date: "2026-09-12"
    published_raw: "Sat, 12 Sep 2026 19:00:00 -0500"
    type: "Main"
    rss_episode_type: "full"
    page_url: "https://commondescentpodcast.podbean.com/e/episode-252-ice-ages/"
    audio_url: "https://mcdn.podbean.com/mf/web/uitzkfgetrj9k5tt/Episode_252_Ice_Ages.mp3"
    guid: "commondescentpodcast.podbean.com/a229052d-c277-3117-ac4d-3b110c626d2c"
    description: "About 10% of the Earth’s land surface is currently covered in persistent glacial ice, but for most of Earth history, that number was much closer to zero. This episode, we explore what happens when ice overtakes our planet and how we investigate icy conditions of the distant past, and we’ll take a close look at the most recent (and ongoing) global climate event that we commonly call the Ice Age.\nIn the news: distant space objects, snake embryos, Jurassic chirps, and polar dinosaur nests.\nTime Markers:\nIntro & Announcements: 00:00:00\nNews: 00:05:35\nMain discussion, Part 1: 00:40:35\nMain discussion, Part 2: 01:16:45\nPatron question: 02:02:10\nJoin us on Patreon to support the podcast and enjoy bonus content: https://www.patreon.com/commondescentpodcast\nCheck out our website for this episode’s blog post and more: http://commondescentpodcast.com/\nGot a topic you want to hear about? Submit your episode request here: https://commondescentpodcast.com/request-a-topic/\nLots more ways to connect with us: https://linktr.ee/common_descent\nThe Intro and Outro music is “On the Origin of Species” by Protodome. More music like this at http://ocremix.org\nMusical Interludes are \"Professor Umlaut\" by Kevin MacLeod (incompetech.com). Licensed under Creative Commons: By Attribution 3.0 http://creativecommons.org/licenses/by/3.0"
