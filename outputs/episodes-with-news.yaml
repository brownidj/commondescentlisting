    rss_episode_number: "314"
    title: "Edward Drinker Cope"
    original_title: "Episode 211 - Edward Drinker Cope"
    date: "2025-02-15"
    published_raw: "Sat, 15 Feb 2025 20:00:00 -0500"
    type: "Main"
    rss_episode_type: "full"
    page_url: "https://commondescentpodcast.podbean.com/e/episode-211-edward-drinker-cope/"
    audio_url: "https://mcdn.podbean.com/mf/web/r7y43du835ya952s/Episode_211_Edward_Drinker_Cope.mp3"
    guid: "commondescentpodcast.podbean.com/cc88aa4b-ed56-3e30-ae5c-9f44657043e0"
    description: "E. D. Cope is one of the most recognizable and notorious names in paleontology history. He did some of the most important early work in vertebrate paleontology, he was one half of the dueling duo in the infamous Bone Wars, he named some of the most famous fossil animals, and he was profoundly irresponsible and unethical with his science. This episode, we’re joined by Astrid Lundberg to explore the life and legacy of Edward Cope, investigating such questions as: How did he get his start? What lasting contributions did he make to paleontology? And what was wrong with this guy?\nIn the news: giant small pterosaurs, plesiosaur skin, bat teeth, and African isotopes.\nTime markers:\nIntro & Announcements: 00:00:00\nNews: 00:05:50\nMain discussion, Part 1: 00:44:15\nMain discussion, Part 2: 01:36:10\nPatron question: 02:26:30\nFind Astrid as OddPride on TikTok and BlueSky and Astrid_Lundberg on Instagram and YouTube.\nAnd you can support her at www.patreon.com/OddPride\nResources:\nCalifornia Fire Foundation: https://www.cafirefoundation.org/\nTransLifeline: https://translifeline.org/\nFill out our Listener Survey here: https://forms.gle/CSoZaCbGN2DsRLTR6\nCheck out our website for this episode’s blog post and more: http://commondescentpodcast.com/\nJoin us on Patreon to support the podcast and enjoy bonus content: https://www.patreon.com/commondescentpodcast\nGot a topic you want to hear about? Submit your episode request here: https://commondescentpodcast.com/request-a-topic/\nLots more ways to connect with us: https://linktr.ee/common_descent\nThe Intro and Outro music is “On the Origin of Species” by Protodome. More music like this at http://ocremix.org\nMusical Interludes are \"Professor Umlaut\" by Kevin MacLeod (incompetech.com). Licensed under Creative Commons: By Attribution 3.0 http://creativecommons.org/licenses/by/3.0"
    news:
      start_time: "00:05:50"
      summary: "giant small pterosaurs, plesiosaur skin, bat teeth, and African isotopes."
