    title: "Tyrannosaurs"
    original_title: "Episode 120 – Tyrannosaurs"
    date: "2021-08-21"
    published_raw: "Sat, 21 Aug 2021 20:08:04 -0500"
    type: "Main"
    rss_episode_type: "full"
    page_url: "https://commondescentpodcast.podbean.com/e/episode-120-%e2%80%93-tyrannosaurs/"
    audio_url: "https://mcdn.podbean.com/mf/web/zeinfj/Episode_120_Tyrannosaurs.mp3"
    guid: "commondescentpodcast.podbean.com/26c5770a-aa28-33b5-acad-0014ead59af6"
    description: "Ever since T. rex was first identified in 1905, tyrannosaurs have been among the most famous and well-studied dinosaurs of all time. Research, especially in the last few decades, has revealed incredible details of tyrannosaur evolution, lifestyles, and development. This episode, we take a tour through tyrannosaur history, envision what these predators were like in life, and touch on some of the most prominent tyrannosaur controversies, including their notorious popularity.\nIn the news: venom evolution, mammoth roaming, Jurassic land-croc, and climate change.\nTime markers:\nIntro & Announcements: 00:00:00\nNews: 00:07:30\nMain discussion, Part 1: 00:45:30\nMain discussion, Part 2: 01:24:00\nPatron question: 02:44:30\nCheck out our blog for bonus info and pictures:\nhttp://commondescentpodcast.wordpress.com/\nJoin us on Patreon to support the podcast and enjoy bonus content! https://www.patreon.com/commondescentpodcast\nOr, make a one-time donation via PayPal: https://tinyurl.com/4c68u4hp\nFind merch at the Common Descent Store! http://zazzle.com/common_descent\nFollow and Support us on:\nTwitter: https://twitter.com/CommonDescentPC\nFacebook: https://www.facebook.com/commondescentpodcast\nInstagram: @commondescentpodcast\nYouTube: https://www.youtube.com/channel/UCePRXHEnZmTGum2r1l2mduw\nPodBean: https://commondescentpodcast.podbean.com/\niTunes: https://itunes.apple.com/us/podcast/the-common-descent-podcast/id1207586509?mt=2\nThe Intro and Outro music is “On the Origin of Species” by Protodome.\nMore music like this at http://ocremix.org.\nMusical Interludes are \"Professor Umlaut\" by Kevin MacLeod (incompetech.com). Licensed under Creative Commons: By Attribution 3.0\nhttp://creativecommons.org/licenses/by/3.0/"
