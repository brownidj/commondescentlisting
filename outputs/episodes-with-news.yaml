  - episode_number: "147"
    rss_episode_number: "214"
    title: "Genetics"
    original_title: "Episode 147 - Genetics"
    date: "2022-09-03"
    published_raw: "Sat, 03 Sep 2022 19:30:00 -0500"
    type: "Main"
    rss_episode_type: "full"
    page_url: "https://commondescentpodcast.podbean.com/e/episode-147-genetics/"
    audio_url: "https://mcdn.podbean.com/mf/web/hrw9v2/Episode_147_Genetics.mp3"
    guid: "commondescentpodcast.podbean.com/f090f941-bb82-316b-bc21-3cada20ea2c1"
    description: "For many years, scientists pondered the question: how and why do offspring inherit traits from their parents? And key to the answer to that question is another question: what determines an organism’s traits in the first place? The pursuit of these answers ultimately led to the modern field of genetics, which itself is crucial to the study of evolution. This episode, we address just a few key points on this vast topic, with a focus on how our understanding of genetics allows us to interpret the history of evolution on our planet.\nIn the news: early fruit-eating, giant Australian birds, beaver evolution, and human speech.\nTime markers:\nIntro & Announcements: 00:00:00\nNews: 00:06:00\nMain discussion, Part 1: 00:37:30\nMain discussion, Part 2: 01:08:30\nPatron question: 02:00:00\nCheck out our blog for bonus info and pictures:\nhttp://commondescentpodcast.wordpress.com/\nJoin us on Patreon to support the podcast and enjoy bonus content! https://www.patreon.com/commondescentpodcast\nOr make a one-time donation via PayPal: https://tinyurl.com/4c68u4hp\nFind merch at the Common Descent Store! http://zazzle.com/common_descent\nJoin the Common Descent Discord server! https://discord.gg/CwPBxdh9Ev\nFollow and Support us on:\nTwitter: https://twitter.com/CommonDescentPC\nFacebook: https://www.facebook.com/commondescentpodcast\nInstagram: @commondescentpodcast\nYouTube: https://www.youtube.com/channel/UCePRXHEnZmTGum2r1l2mduw\nPodBean: https://commondescentpodcast.podbean.com/\niTunes: https://itunes.apple.com/us/podcast/the-common-descent-podcast/id1207586509?mt=2\nYou can email us at commondescentpodcast(at)gmail.com\nOr send us physical mail at:\nThe Common Descent Podcast\n1735 W State of Franklin Rd. Ste 5 #165\nJohnson City, TN 37604\nThe Intro and Outro music is “On the Origin of Species” by Protodome.\nMore music like this at http://ocremix.org.\nMusical Interludes are \"Professor Umlaut\" by Kevin MacLeod (incompetech.com). Licensed under Creative Commons: By Attribution 3.0\nhttp://creativecommons.org/licenses/by/3.0/"
