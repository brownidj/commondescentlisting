  - episode_number: "115"
    rss_episode_number: "168"
    title: "Biomes"
    original_title: "Episode 115 - Biomes"
    date: "2021-06-12"
    published_raw: "Sat, 12 Jun 2021 19:10:00 -0500"
    type: "Main"
    rss_episode_type: "full"
    page_url: "https://commondescentpodcast.podbean.com/e/episode-115-biomes/"
    audio_url: "https://mcdn.podbean.com/mf/web/fdes3t/Episode_115_Biomes.mp3"
    guid: "commondescentpodcast.podbean.com/371302db-0cd8-3aca-9194-84b550d6ecf8"
    description: "All over the Earth, there are biological communities that differ depending on the local climate and landscape. These are biomes, and biologists love to map them to unravel patterns of ecosystem distribution. But biomes also change over time as climates and landscapes shift. In this episode, our favorite paleobotanist, Dr. Aly Baumgartner, joins us to discuss how we identify biomes in the past and present, how they’ve changed over time, and what it means for a new biome to arise … or for an old one to go extinct.\nIn the news: whale diets, moa poop, shark extinction, and flower seeds.\nFollow Aly on Twitter or Instagram @paleolorax\nTime markers:\nIntro & Announcements: 00:00:00\nNews: 00:05:00\nMain discussion, Part 1: 00:33:00\nMain discussion, Part 2: 01:11:30\nPatron question: 01:46:30\nCheck out our blog for bonus info and pictures:\nhttp://commondescentpodcast.wordpress.com/\nFind merch at the Common Descent Store! http://zazzle.com/common_descent\nFollow and Support us on:\nPatreon: https://www.patreon.com/commondescentpodcast\nTwitter: https://twitter.com/CommonDescentPC\nFacebook: https://www.facebook.com/commondescentpodcast\nInstagram: @commondescentpodcast\nYouTube: https://www.youtube.com/channel/UCePRXHEnZmTGum2r1l2mduw\nPodBean: https://commondescentpodcast.podbean.com/\niTunes: https://itunes.apple.com/us/podcast/the-common-descent-podcast/id1207586509?mt=2\nThe Intro and Outro music is “On the Origin of Species” by Protodome.\nMore music like this at http://ocremix.org.\nMusical Interludes are \"Professor Umlaut\" by Kevin MacLeod (incompetech.com). Licensed under Creative Commons: By Attribution 3.0\nhttp://creativecommons.org/licenses/by/3.0/"
