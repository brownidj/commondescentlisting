    title: "The \"Sixth Extinction\" (Modern Biodiversity Crisis)"
    original_title: "Episode 55 - The \"Sixth Extinction\" (Modern Biodiversity Crisis)"
    date: "2019-02-23"
    published_raw: "Sat, 23 Feb 2019 20:01:00 -0500"
    type: "Main"
    rss_episode_type: "full"
    page_url: "https://commondescentpodcast.podbean.com/e/episode-55-the-sixth-extinction-modern-biodiversity-crisis/"
    audio_url: "https://mcdn.podbean.com/mf/web/w8cdwq/Episode_55_-_The_Sixth_Extinction.mp3"
    guid: "commondescentpodcast.podbean.com/episode-55-the-sixth-extinction-modern-biodiversity-crisis-e94f872b5e289756b8f43740868c82b7"
    description: "Usually, when we talk about mass extinction, we’re referring to events long past. But scary levels of extinction are a fact of our current world, as well. So much so that current events have been labeled the \"Sixth Extinction.” In this episode, we discuss just how bad our current ecological crisis is, what’s causing it, and whether or not it truly deserves to be called a mass extinction. We also discuss what’s already being done – and what we can all do – to counteract catastrophe. It’s a depressing one, folks, but all isn’t lost. Stay informed and stay hopeful!\nIn the news: a new island, ancient turtle cancer, megalodon extinction, and that one Archaeopteryx feather.\nTime markers:\nIntro & Announcements: 00:00:00\nNews: 00:07:30\nMain discussion, Part 1: 00:44:30\nMain discussion, Part 2: 01:21:00\nCheck out our blog for bonus info and pictures:\nhttp://commondescentpodcast.wordpress.com/\nFollow and Support us on:\nPatreon: https://www.patreon.com/commondescentpodcast\nTwitter: https://twitter.com/CommonDescentPC\nFacebook: https://www.facebook.com/commondescentpodcast/\nPodBean: https://commondescentpodcast.podbean.com/\niTunes: https://itunes.apple.com/us/podcast/the-common-descent-podcast/id1207586509?mt=2\nYouTube: https://www.youtube.com/channel/UCePRXHEnZmTGum2r1l2mduw\nThe Intro and Outro music is “On the Origin of Species” by Protodome.\nMore music like this at http://ocremix.org.\nMuscial Interludes are \"Professor Umlaut\" by Kevin MacLeod (incompetech.com). Licensed under Creative Commons: By Attribution 3.0\nhttp://creativecommons.org/licenses/by/3.0/"
