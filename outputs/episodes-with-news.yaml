    title: "Sexual Dimorphism"
    original_title: "Episode 249 - Sexual Dimorphism"
    date: "2026-08-01"
    published_raw: "Sat, 01 Aug 2026 19:00:00 -0500"
    type: "Main"
    rss_episode_type: "full"
    page_url: "https://commondescentpodcast.podbean.com/e/episode-249-sexual-dimorphism/"
    audio_url: "https://mcdn.podbean.com/mf/web/7rvxdagg2cu6iqjr/Episode_249_Sexual_Dimorphism.mp3"
    guid: "commondescentpodcast.podbean.com/269db4a6-2f94-3ce1-97b3-005b584358dd"
    description: "In most animal species, there are differences in the anatomy, behavior, and lifestyle of male and female individuals. In this episode, we explore the incredible variety of these differences and the equally incredible blurry areas between the sexes, we investigate the evolutionary processes behind these features, and we examine the constant and confounding discussion about whether or not we can spot sexual dimorphism in the fossil record.\nIn the news: The Story of Birds, early snakes, and early archosaurs.\nTime Markers:\nIntro & Announcements: 00:00:00\nNews: 00:05:40\nMain discussion, Part 1: 00:42:45\nMain discussion, Part 2: 01:34:40\nPatron question: 02:45:00\nJoin us on Patreon to support the podcast and enjoy bonus content: https://www.patreon.com/commondescentpodcast\nCheck out our website for this episode’s blog post and more: http://commondescentpodcast.com/\nGot a topic you want to hear about? Submit your episode request here: https://commondescentpodcast.com/request-a-topic/\nLots more ways to connect with us: https://linktr.ee/common_descent\nThe Intro and Outro music is “On the Origin of Species” by Protodome. More music like this at http://ocremix.org\nMusical Interludes are \"Professor Umlaut\" by Kevin MacLeod (incompetech.com). Licensed under Creative Commons: By Attribution 3.0 http://creativecommons.org/licenses/by/3.0"
