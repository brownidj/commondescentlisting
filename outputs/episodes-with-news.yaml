  - episode_number: "129"
    rss_episode_number: "189"
    title: "Rhinos"
    original_title: "Episode 129 - Rhinos"
    date: "2021-12-25"
    published_raw: "Sat, 25 Dec 2021 20:00:00 -0500"
    type: "Main"
    rss_episode_type: "full"
    page_url: "https://commondescentpodcast.podbean.com/e/episode-129-rhinos/"
    audio_url: "https://mcdn.podbean.com/mf/web/abbudh/Episode_129_Rhinos.mp3"
    guid: "commondescentpodcast.podbean.com/6cdaad25-cae9-3887-b0e3-08f638842f6b"
    description: "Today, rhinos are famous for their large size and impressive horns (and their distressing conservation status, sadly), but modern rhinos are only a small sample of what rhinos have been over time. Thanks to a surprisingly good rhino fossil record, we have a pretty good picture of how these animals got started and of the surprising forms they’ve taken since, from horse-like runners to hippo-shaped waders to gargantuan behemoths. This episode, we discuss rhinos as we know them, rhinos when they were weird, and a few rhino-y things that aren’t rhinos at all.\nIn the news: ancient croc hunting, dinosaur colors, shrinking orangutans, and ammonite soft tissue.\nTime markers:\nIntro & Announcements: 00:00:00\nNews: 00:04:30\nMain discussion, Part 1: 00:35:30\nMain discussion, Part 2: 01:13:30\nPatron question: 02:12:00\nCheck out our blog for bonus info and pictures:\nhttp://commondescentpodcast.wordpress.com/\nJoin us on Patreon to support the podcast and enjoy bonus content! https://www.patreon.com/commondescentpodcast\nOr make a one-time donation via PayPal: https://tinyurl.com/4c68u4hp\nFind merch at the Common Descent Store! http://zazzle.com/common_descent\nFollow and Support us on:\nTwitter: https://twitter.com/CommonDescentPC\nFacebook: https://www.facebook.com/commondescentpodcast\nInstagram: @commondescentpodcast\nYouTube: https://www.youtube.com/channel/UCePRXHEnZmTGum2r1l2mduw\nPodBean: https://commondescentpodcast.podbean.com/\niTunes: https://itunes.apple.com/us/podcast/the-common-descent-podcast/id1207586509?mt=2\nYou can email us at commondescentpodcast(at)gmail.com\nOr send us physical mail at:\nThe Common Descent Podcast\n1735 W State of Franklin Rd. Ste 5 #165\nJohnson City, TN 37604\nThe Intro and Outro music is “On the Origin of Species” by Protodome.\nMore music like this at http://ocremix.org.\nMusical Interludes are \"Professor Umlaut\" by Kevin MacLeod (incompetech.com). Licensed under Creative Commons: By Attribution 3.0\nhttp://