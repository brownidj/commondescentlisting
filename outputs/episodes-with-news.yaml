  - episode_number: "114"
    rss_episode_number: "167"
    title: "Polar Life"
    original_title: "Episode 114 - Polar Life"
    date: "2021-05-29"
    published_raw: "Sat, 29 May 2021 19:20:43 -0500"
    type: "Main"
    rss_episode_type: "full"
    page_url: "https://commondescentpodcast.podbean.com/e/episode-114-polar-life/"
