    guid: "commondescentpodcast.podbean.com/episode-29-placoderms-the-armored-fish-24b00f90dd1700f333f1ee8f1a4eedd1"
    description: "In the earliest millennia of vertebrate life on Earth, the seas were home to the placoderms, a diverse group of extinct armored fish whose evolutionary innovations set the stage for some of the most important features of vertebrate life. This episode, we talk about some of history's most influential placoderms, with a special spotlight on the most famous of armored fish, the giant predator Dunkleosteus.\nIn the news: asteroids and volcanoes, running lizards, Shawn's turtle, walking fish, and more on broken mastodon bones.\nTime markers:\nIntro & Announcements: 00:00:00\nNews: 00:02:30\nMain discussion: 00:35:00\nCheck out our blog for bonus info and pictures:\nhttp://commondescentpodcast.wordpress.com/\nFollow and Support us on:\nPatreon: https://www.patreon.com/commondescentpodcast\nTwitter: https://twitter.com/CommonDescentPC\nFacebook: https://www.facebook.com/commondescentpodcast/\nPodBean: https://commondescentpodcast.podbean.com/\niTunes: https://itunes.apple.com/us/podcast/the-common-descent-podcast/id1207586509?mt=2\nYouTube: https://www.youtube.com/channel/UCePRXHEnZmTGum2r1l2mduw\nThe Podcast music is “On the Origin of Species” by Protodome.\nMore music like this at http://ocremix.org."
