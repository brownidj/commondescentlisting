    title: "Mutations"
    original_title: "Episode 223 - Mutations"
    date: "2025-08-02"
    published_raw: "Sat, 02 Aug 2025 19:00:00 -0500"
    type: "Main"
    rss_episode_type: "full"
    page_url: "https://commondescentpodcast.podbean.com/e/episode-223-mutations/"
