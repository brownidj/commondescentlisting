    title: "The Jehol Biota"
    original_title: "Episode 152 - The Jehol Biota"
    date: "2022-11-12"
    published_raw: "Sat, 12 Nov 2022 20:00:00 -0500"
    type: "Main"
    rss_episode_type: "full"
    page_url: "https://commondescentpodcast.podbean.com/e/episode-152-the-jehol-biota/"
    audio_url: "https://mcdn.podbean.com/mf/web/bf83hb/Episode_152_Jehol_Biota.mp3"
    guid: "commondescentpodcast.podbean.com/13bfc547-9c14-3f71-9d19-e25fcc3e6890"
    description: "You might have noticed that over the last few decades, a lot of really exciting and famous fossil discoveries have been coming out of China. If you pay close attention, you might even catch that many of them are coming from the same place: the incredible fossil assemblages of the Jehol Biota. We’ve mentioned Jehol fossils many times on the podcast, but in this episode, we focus on the big picture: where do these fossils come from, why are they so incredibly well-preserved, and what are just some of the fascinating research questions we can answer by examining these amazing fossils?\nIn the news: bird evolution, dinosaur growth patterns, mammal speciation rates, and glowing scallops.\nTime markers:\nIntro & Announcements: 00:00:00\nNews: 00:08:00\nMain discussion, Part 1: 00:48:30\nMain discussion, Part 2: 01:15:30\nPatron question: 01:51:30\nCheck out our blog for bonus info and pictures:\nhttp://commondescentpodcast.wordpress.com/\nThe 2022 End of the Year Q&A Form is LIVE! Submit your question now!\nhttps://forms.gle/GTgew75GmVxAKejt6\nFollow this link for a 30-day free trial to Audible!\nwww.audibletrial.com/CommonDescent\nJoin us on Patreon to support the podcast and enjoy bonus content! https://www.patreon.com/commondescentpodcast\nOr make a one-time donation via PayPal: https://tinyurl.com/4c68u4hp\nFind merch at the Common Descent Store! http://zazzle.com/common_descent\nJoin the Common Descent Discord server! https://discord.gg/CwPBxdh9Ev\nFollow and Support us on:\nTwitter: https://twitter.com/CommonDescentPC\nFacebook: https://www.facebook.com/commondescentpodcast\nInstagram: @commondescentpodcast\nYouTube: https://www.youtube.com/channel/UCePRXHEnZmTGum2r1l2mduw\nPodBean: https://commondescentpodcast.podbean.com/\niTunes: https://itunes.apple.com/us/podcast/the-common-descent-podcast/id1207586509?mt=2\nYou can email us at commondescentpodcast(at)gmail.com\nOr send us physical mail at:\nThe Common Descent Podcast\n1735 W State of Franklin