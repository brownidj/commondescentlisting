  - episode_number: "148"
    rss_episode_number: "215"
    title: "Gliding"
    original_title: "Episode 148 - Gliding"
    date: "2022-09-17"
    published_raw: "Sat, 17 Sep 2022 19:16:00 -0500"
    type: "Main"
    rss_episode_type: "full"
    page_url: "https://commondescentpodcast.podbean.com/e/episode-148-gliding/"
    audio_url: "https://mcdn.podbean.com/mf/web/4mz44s/Episode_148_Gliding.mp3"
    guid: "commondescentpodcast.podbean.com/42161c94-ac32-3ba6-a82e-62871f69dd3e"
    description: "Powered flight is hard, and evolution has only produced it a few times. Gliding, however, is much easier and much more common. In fact, there is an astonishing diversity of gliding organisms to be found in our modern world as well as in the fossil record, with an incredible variety in the adaptations they use to sail through the sky. This episode, we’ll explore what it takes to glide and what patterns we see in gliding evolution, and we’ll also geek out about all the amazing sizes, shapes, and strategies of gliders.\nIn the news: coral mutations, African dinosaurs, croc brains, and ancient amputation.\nTime markers:\nIntro & Announcements: 00:00:00\nNews: 00:07:00\nMain discussion, Part 1: 00:41:30\nMain discussion, Part 2: 01:28:30\nPatron question: 02:22:00\nCheck out our blog for bonus info and pictures:\nhttp://commondescentpodcast.wordpress.com/\nSupport Mouse’s classroom!\nhttps://www.donorschoose.org/classroom/mx-hecht\nJoin us on Patreon to support the podcast and enjoy bonus content! https://www.patreon.com/commondescentpodcast\nOr make a one-time donation via PayPal: https://tinyurl.com/4c68u4hp\nFind merch at the Common Descent Store! http://zazzle.com/common_descent\nJoin the Common Descent Discord server! https://discord.gg/CwPBxdh9Ev\nFollow and Support us on:\nTwitter: https://twitter.com/CommonDescentPC\nFacebook: https://www.facebook.com/commondescentpodcast\nInstagram: @commondescentpodcast\nYouTube: https://www.youtube.com/channel/UCePRXHEnZmTGum2r1l2mduw\nPodBean: https://commondescentpodcast.podbean.com/\niTunes: https://itunes.apple.com/us/podcast/the-common-descent-podcast/id1207586509?mt=2\nYou can email us at commondescentpodcast(at)gmail.com\nOr send us physical mail at:\nThe Common Descent Podcast\n1735 W State of Franklin Rd. Ste 5 #165\nJohnson City, TN 37604\nThe Intro and Outro music is “On the Origin of Species” by Protodome.\nMore music like this at http://ocremix.org.\nMusical Interludes are \"Professor Umlaut\" by