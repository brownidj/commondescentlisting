    title: "The Sun"
    original_title: "Episode 251 - The Sun"
    date: "2026-08-29"
    published_raw: "Sat, 29 Aug 2026 19:00:00 -0500"
    type: "Main"
    rss_episode_type: "full"
    page_url: "https://commondescentpodcast.podbean.com/e/episode-251-the-sun/"
    audio_url: "https://mcdn.podbean.com/mf/web/pct2jrkeav7ue9hb/Episode_251_The_Sun.mp3"
    guid: "commondescentpodcast.podbean.com/a15ce8b3-cbe8-386d-bade-d4270b86ce01"
    description: "The Sun is kind of a big deal. It is the center of our solar system, around which all other objects revolve, and its heat and light are responsible for the life-supporting conditions here on Earth. This episode, we take a close look at how the Sun actually works and what makes it different from other stars. Then, we track the lifetime of the Sun, exploring how it originally formed, how it has changed over its lifetime, and how it will eventually burn out.\nIn the news: carnivorous plants, ancient burrowers, live birth, and reptile metabolism.\nTime Markers:\nIntro & Announcements: 00:00:00\nNews: 00:07:50\nMain discussion, Part 1: 00:46:30\nMain discussion, Part 2: 01:47:40\nPatron question: 02:37:05\n💗\nhttps://imaginationlibrary.com/the-dollywood-foundation/\nJoin us on Patreon to support the podcast and enjoy bonus content: https://www.patreon.com/commondescentpodcast\nCheck out our website for this episode’s blog post and more: http://commondescentpodcast.com/\nGot a topic you want to hear about? Submit your episode request here: https://commondescentpodcast.com/request-a-topic/\nLots more ways to connect with us: https://linktr.ee/common_descent\nThe Intro and Outro music is “On the Origin of Species” by Protodome. More music like this at http://ocremix.org\nMusical Interludes are \"Professor Umlaut\" by Kevin MacLeod (incompetech.com). Licensed under Creative Commons: By Attribution 3.0 http://creativecommons.org/licenses/by/3.0"
