    original_title: "Episode 30 - Prehistoric Poop"
    date: "2018-03-11"
    published_raw: "Sun, 11 Mar 2018 02:28:56 -0500"
    type: "Main"
    rss_episode_type: "full"
    page_url: "https://commondescentpodcast.podbean.com/e/episode-30-prehistoric-poop/"
    audio_url: "https://mcdn.podbean.com/mf/web/hc9imz/Episode_30_-_Prehistoric_Poop.mp3"
    guid: "commondescentpodcast.podbean.com/episode-30-prehistoric-poop-24b00f90dd1700f333f1ee8f1a4eedd1"
    description: "Everybody poops! Throughout the history of life on Earth, animals of all lifestyles have been littering the planet with little presents, and those few that fossilize become coprolites: unique time capsules that can serve as invaluable sources of information, not just on obvious stuff like ancient diets, but also about evolution, extinction, and more. This episode: we talk turds.\nIn the news: de-escalating plant evolution, reverse speciation in ravens, upside-down dinosaurs, and record-keeping giant sponges.\nTime markers:\nIntro & Announcements: 00:00:00\nNews: 00:06:00\nMain discussion: 00:37:30\nCheck out our blog for bonus info and pictures:\nhttp://commondescentpodcast.wordpress.com/\nFollow and Support us on:\nPatreon: https://www.patreon.com/commondescentpodcast\nTwitter: https://twitter.com/CommonDescentPC\nFacebook: https://www.facebook.com/commondescentpodcast/\nPodBean: https://commondescentpodcast.podbean.com/\niTunes: https://itunes.apple.com/us/podcast/the-common-descent-podcast/id1207586509?mt=2\nYouTube: https://www.youtube.com/channel/UCePRXHEnZmTGum2r1l2mduw\nThe Podcast music is “On the Origin of Species” by Protodome.\nMore music like this at http://ocremix.org."
