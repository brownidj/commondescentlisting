    title: "Kangaroos"
    original_title: "Episode 253 - Kangaroos"
    date: "2026-09-26"
    published_raw: "Sat, 26 Sep 2026 19:00:33 -0500"
    type: "Main"
    rss_episode_type: "full"
    page_url: "https://commondescentpodcast.podbean.com/e/episode-253-kangaroos/"
