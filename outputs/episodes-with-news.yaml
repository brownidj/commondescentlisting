    title: "The Karoo Supergroup"
    original_title: "Episode 208 - The Karoo Supergroup"
    date: "2025-01-04"
    published_raw: "Sat, 04 Jan 2025 20:00:00 -0500"
    type: "Main"
    rss_episode_type: "full"
    page_url: "https://commondescentpodcast.podbean.com/e/episode-208-the-karoo-supergroup/"
    audio_url: "https://mcdn.podbean.com/mf/web/y8q2x6azpqqdkxrb/Episode_208_The_Karoo_Supergroup.mp3"
    guid: "commondescentpodcast.podbean.com/870afb21-277f-398e-ba55-6e50d68ceda6"
    description: "Southern Africa is home to an incredible sequence of geologic formations that span more than 100 million years of Earth history. These rocks, collectively called the Karoo Supergroup, are an extraordinary resource for studying evolution and extinction across the Late Paleozoic and Early Mesozoic Eras. This episode, we’ll explore the deep history of this vast geologic resource, and we’ll sample some of the discoveries that have been made there.\nIn the news: dormancy evolution, Pangaean amphibians, regeneration genes, and Neanderthal fossil collectors.\nTime markers:\nIntro & Announcements: 00:00:00\nNews: 00:03:55\nMain discussion, Part 1: 00:36:00\nMain discussion, Part 2: 01:04:30\nPatron question: 01:33:30\nCheck out our website for this episode’s blog post and more: http://commondescentpodcast.com/\nJoin us on Patreon to support the podcast and enjoy bonus content: https://www.patreon.com/commondescentpodcast\nGot a topic you want to hear about? Submit your episode request here: https://commondescentpodcast.com/request-a-topic/\nLots more ways to connect with us: https://linktr.ee/common_descent\nThe Intro and Outro music is “On the Origin of Species” by Protodome. More music like this at http://ocremix.org\nMusical Interludes are \"Professor Umlaut\" by Kevin MacLeod (incompetech.com). Licensed under Creative Commons: By Attribution 3.0 http://creativecommons.org/licenses/by/3.0"
