    guid: "commondescentpodcast.podbean.com/episode-76-horse-evolution-82ff78f020a89ccd3c81a5c428f7b376"
    description: "The evolution of horses is a classic story, first because it is a beautiful example of evolution in the fossil record, and second because of how our scientific perspective of this story has shifted over the years. From the tiny forest-dwellers of the Eocene, barely recognizable as horse-relatives, to the mighty domesticated animals we know today, we’ll unpack what we know – and what we thought we knew – about horse evolution.\nIn the news: dinosaur teeth, alligator tools, ancient embryos, and dinosaur heads.\nTime markers:\nIntro & Announcements: 00:00:00\nNews: 00:05:00\nMain discussion, Part 1: 00:37:00\nMain discussion, Part 2: 01:15:00\nPatron question: 01:47:30\nCheck out our blog for bonus info and pictures:\nhttp://commondescentpodcast.wordpress.com/\nWe made an appearance on The Science of Pokémon to talk about - what else? - fossil Pokémon! https://podcasts.apple.com/us/podcast/history-of-galar/id1287752766?i=1000459595554\nThe Common Descent Store is open! Get merch! http://zazzle.com/common_descent\nFollow and Support us on:\nPatreon: https://www.patreon.com/commondescentpodcast\nTwitter: https://twitter.com/CommonDescentPC\nFacebook: https://www.facebook.com/commondescentpodcast/\nPodBean: https://commondescentpodcast.podbean.com/\niTunes: https://itunes.apple.com/us/podcast/the-common-descent-podcast/id1207586509?mt=2\nYouTube: https://www.youtube.com/channel/UCePRXHEnZmTGum2r1l2mduw\nThe Intro and Outro music is “On the Origin of Species” by Protodome.\nMore music like this at http://ocremix.org.\nMusical Interludes are \"Professor Umlaut\" by Kevin MacLeod (incompetech.com). Licensed under Creative Commons: By Attribution 3.0\nhttp://creativecommons.org/licenses/by/3.0/"
