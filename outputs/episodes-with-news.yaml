    rss_episode_number: "188"
    title: "The Deep Sea"
    original_title: "Episode 128 - The Deep Sea"
    date: "2021-12-11"
    published_raw: "Sat, 11 Dec 2021 21:12:20 -0500"
    type: "Main"
    rss_episode_type: "full"
    page_url: "https://commondescentpodcast.podbean.com/e/episode-128-the-deep-sea/"
    audio_url: "https://mcdn.podbean.com/mf/web/fj2y43/Episode_128_The_Deep_Sea.mp3"
    guid: "commondescentpodcast.podbean.com/fa30f6d1-da11-3fea-9120-8f6a694b377b"
    description: "Far below the ocean surface is a vast environment of cold, darkness, very scarce food, and surprisingly diverse life. Deep sea life is quite mysterious, in part because of their unusual adaptations for surviving in such tough habitats, and also because it’s very difficult to study organisms of the deep, modern or fossil. In this episode, we discuss what is known about the adaptations, evolutionary history, and diversity of life in the deep sea.\nIn the news: blade-tailed ankylosaurs, ostrich-like dinosaurs, shrimps in clams, and carnivorous ichthyosaurs.\nTime markers:\nIntro & Announcements: 00:00:00\nNews: 00:04:00\nMain discussion, Part 1: 00:35:00\nMain discussion, Part 2: 01:25:30\nPatron question: 02:01:30\nCheck out our blog for bonus info and pictures:\nhttp://commondescentpodcast.wordpress.com/\nWe're now taking questions for our End of the Year Q&A! Submit your question here: https://forms.gle/Q3jHtLSp5CdFuAuL9\nJoin us on Patreon to support the podcast and enjoy bonus content! https://www.patreon.com/commondescentpodcast\nOr make a one-time donation via PayPal: https://tinyurl.com/4c68u4hp\nFind merch at the Common Descent Store! http://zazzle.com/common_descent\nFollow and Support us on:\nTwitter: https://twitter.com/CommonDescentPC\nFacebook: https://www.facebook.com/commondescentpodcast\nInstagram: @commondescentpodcast\nYouTube: https://www.youtube.com/channel/UCePRXHEnZmTGum2r1l2mduw\nPodBean: https://commondescentpodcast.podbean.com/\niTunes: https://itunes.apple.com/us/podcast/the-common-descent-podcast/id1207586509?mt=2\nYou can email us at commondescentpodcast(at)gmail.com\nOr send us physical mail at:\nThe Common Descent Podcast\n1735 W State of Franklin Rd. Ste 5 #165\nJohnson City, TN 37604\nThe Intro and Outro music is “On the Origin of Species” by Protodome.\nMore music like this at http://ocremix.org.\nMusical Interludes are \"Professor Umlaut\" by Kevin MacLeod (incompetech.com). Licensed under Creative Commons: By Attrib