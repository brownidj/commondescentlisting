    title: "The Late Devonian Extinction(s)"
    original_title: "Episode 65 - The Late Devonian Extinction(s)"
    date: "2019-07-13"
    published_raw: "Sat, 13 Jul 2019 19:57:05 -0500"
    type: "Main"
    rss_episode_type: "full"
    page_url: "https://commondescentpodcast.podbean.com/e/episode-65-the-late-devonian-extinctions/"
    audio_url: "https://mcdn.podbean.com/mf/web/2tkgu4/Episode_65_-_The_Late_Devonian_Extinction_s_.mp3"
    guid: "commondescentpodcast.podbean.com/episode-65-the-late-devonian-extinctions-ccf8c20304bd2f592f89b5d657ed8a19"
    description: "It’s Episode 65, and you know what that means … extinction! This time, we address the ancient and confusing Late Devonian extinction. This is traditionally considered one of the “Big 5,” but it doesn’t seem to be “one” extinction at all. Geologists and paleontologists continue to work at piecing together the various causes and consequences that create an extended series – several millions years long – of very unfortunate events that altogether comprise one of the worst biological crises in Earth history.\nIn the news: tyrannosaur smells, peccary behavior, and a talk (by us) about our podcast!\nTime markers:\nIntro & Announcements: 00:00:00\nNews: 00:05:00\nMain discussion, Part 1: 00:33:30\nMain discussion, Part 2: 00:59:30\nPatron question: 01:37:30\nCheck out our blog for bonus info and pictures:\nhttp://commondescentpodcast.wordpress.com/\nThe Common Descent Store is open! Get merch! http://zazzle.com/common_descent\nFollow and Support us on:\nPatreon: https://www.patreon.com/commondescentpodcast\nTwitter: https://twitter.com/CommonDescentPC\nFacebook: https://www.facebook.com/commondescentpodcast/\nPodBean: https://commondescentpodcast.podbean.com/\niTunes: https://itunes.apple.com/us/podcast/the-common-descent-podcast/id1207586509?mt=2\nYouTube: https://www.youtube.com/channel/UCePRXHEnZmTGum2r1l2mduw\nThe Intro and Outro music is “On the Origin of Species” by Protodome.\nMore music like this at http://ocremix.org.\nMuscial Interludes are \"Professor Umlaut\" by Kevin MacLeod (incompetech.com). Licensed under Creative Commons: By Attribution 3.0\nhttp://creativecommons.org/licenses/by/3.0/"
