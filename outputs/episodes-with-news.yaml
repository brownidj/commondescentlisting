    title: "Ontogeny"
    original_title: "Episode 33 - Ontogeny"
    date: "2018-04-22"
    published_raw: "Sun, 22 Apr 2018 00:07:08 -0500"
    type: "Main"
    rss_episode_type: "full"
    page_url: "https://commondescentpodcast.podbean.com/e/episode-33-ontogeny/"
    audio_url: "https://mcdn.podbean.com/mf/web/4gic8w/Episode_33_-_Ontogeny.mp3"
    guid: "commondescentpodcast.podbean.com/episode-33-ontogeny-24b00f90dd1700f333f1ee8f1a4eedd1"
    description: "Animals don’t start their lives as tiny copies of adults; there are all sorts of changes that a creature goes through from fertilization to birth and from newborn to mature. This development is called ontogeny. In this episode, we discuss how ontogenetic change impacts animals as they grow, what we can learn from these patterns, and how ontogeny can cause confusion in the fossil record.\nIn the news: colorful moth fossils, an enormous ichthyosaur, Neanderthals' strange faces, and sea turtle navigation.\nTime markers:\nIntro & Announcements: 00:00:00\nNews: 00:05:00\nMain discussion, Part 1: 00:30:30\nMain discussion, Part 2: 01:08:30\nCheck out our blog for bonus info and pictures:\nhttp://commondescentpodcast.wordpress.com/\nFollow and Support us on:\nPatreon: https://www.patreon.com/commondescentpodcast\nTwitter: https://twitter.com/CommonDescentPC\nFacebook: https://www.facebook.com/commondescentpodcast/\nPodBean: https://commondescentpodcast.podbean.com/\niTunes: https://itunes.apple.com/us/podcast/the-common-descent-podcast/id1207586509?mt=2\nYouTube: https://www.youtube.com/channel/UCePRXHEnZmTGum2r1l2mduw\nThe Intro and Outro music is “On the Origin of Species” by Protodome.\nMore music like this at http://ocremix.org.\nMuscial Interludes are \"Professor Umlaut\" by Kevin MacLeod (incompetech.com). Licensed under Creative Commons: By Attribution 3.0\nhttp://creativecommons.org/licenses/by/3.0/"
