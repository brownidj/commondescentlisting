    title: "Phytosaurs"
    original_title: "Episode 142 - Phytosaurs"
    date: "2022-06-25"
    published_raw: "Sat, 25 Jun 2022 19:33:19 -0500"
    type: "Main"
    rss_episode_type: "full"
    page_url: "https://commondescentpodcast.podbean.com/e/episode-142-phytosaurs/"
