    date: "2019-11-30"
    published_raw: "Sat, 30 Nov 2019 20:36:09 -0500"
    type: "Main"
    rss_episode_type: "full"
    page_url: "https://commondescentpodcast.podbean.com/e/episode-75-the-great-oxidation-event/"
    audio_url: "https://mcdn.podbean.com/mf/web/kui5mv/Episode_75_-_The_Great_Oxidation_Event.mp3"
    guid: "commondescentpodcast.podbean.com/episode-75-the-great-oxidation-event-19dd1229b3e1c2f1673282d3ad410d52"
    description: "Time for another extinction! This time, we’re discussing what might be the most ancient, most mysterious, and most catastrophic mass extinction event of all time. The Great Oxidation Event marks the turning point that set our atmosphere on course to its current oxygen-rich state and made the Earth hospitable for life as we know it … at the expense of all the life that came before.\nIn the news: the largest ape, early pollinators, early birds, and early snakes.\nTime markers:\nIntro & Announcements: 00:00:00\nNews: 00:04:30\nMain discussion, Part 1: 00:36:00\nMain discussion, Part 2: 01:09:30\nPatron Question: 01:33:00\nCheck out our blog for bonus info and pictures:\nhttp://commondescentpodcast.wordpress.com/\nWe're doing another End of the Year Q&A! Submit your question here:\nhttps://forms.gle/E398RmMhGvaYHpz6A\nThe Common Descent Store is open! Get merch! http://zazzle.com/common_descent\nFollow and Support us on:\nPatreon: https://www.patreon.com/commondescentpodcast\nTwitter: https://twitter.com/CommonDescentPC\nFacebook: https://www.facebook.com/commondescentpodcast/\nPodBean: https://commondescentpodcast.podbean.com/\niTunes: https://itunes.apple.com/us/podcast/the-common-descent-podcast/id1207586509?mt=2\nYouTube: https://www.youtube.com/channel/UCePRXHEnZmTGum2r1l2mduw\nThe Intro and Outro music is “On the Origin of Species” by Protodome.\nMore music like this at http://ocremix.org.\nMusical Interludes are \"Professor Umlaut\" by Kevin MacLeod (incompetech.com). Licensed under Creative Commons: By Attribution 3.0\nhttp://creativecommons.org/licenses/by/3.0/"
