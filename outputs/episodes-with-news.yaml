  - episode_number: "209"
    rss_episode_number: "312"
    title: "Chimaeras"
    original_title: "Episode 209 - Chimaeras"
    date: "2025-01-18"
    published_raw: "Sat, 18 Jan 2025 20:00:00 -0500"
    type: "Main"
    rss_episode_type: "full"
    page_url: "https://commondescentpodcast.podbean.com/e/episode-209-chimaeras/"
    audio_url: "https://mcdn.podbean.com/mf/web/mri87cpdnyrnrp7y/Episode_209_Chimaeras.mp3"
    guid: "commondescentpodcast.podbean.com/a85a9042-6210-3ad8-a468-b9cecbafc41f"
    description: "You might know them as ghost sharks, rat fish, or spook fish. Chimaeras are close cousins of sharks and rays, equipped with distinctive and unusual features in their fins, teeth, and reproductive structures. In today’s oceans, chimaeras are rare and easy to miss, but their extended family includes some of the most diverse and iconic fish of the Paleozoic seas. In this episode, we’ll explore the traits that set chimaeras apart, we’ll take a tour through their ancient relatives, and we’ll investigate what their most famous cousins were doing with their strange spiral rows of teeth.\nIn the news: Baltic herrings, Cambrian arms race, pterosaur tails, and early dinosaurs.\nTime markers:\nIntro & Announcements: 00:00:00\nNews: 00:06:35\nMain discussion, Part 1: 00:40:25\nMain discussion, Part 2: 01:16:45\nPatron question: 02:20:00\nCheck out our website for this episode’s blog post and more: http://commondescentpodcast.com/\nJoin us on Patreon to support the podcast and enjoy bonus content: https://www.patreon.com/commondescentpodcast\nGot a topic you want to hear about? Submit your episode request here: https://commondescentpodcast.com/request-a-topic/\nLots more ways to connect with us: https://linktr.ee/common_descent\nThe Intro and Outro music is “On the Origin of Species” by Protodome. More music like this at http://ocremix.org\nMusical Interludes are \"Professor Umlaut\" by Kevin MacLeod (incompetech.com). Licensed under Creative Commons: By Attribution 3.0 http://creativecommons.org/licenses/by/3.0"
    news:
      start_time: "00:06:35"
