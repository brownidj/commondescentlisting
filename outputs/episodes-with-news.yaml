    guid: "commondescentpodcast.podbean.com/ceb0f34a-ff74-3ecd-b002-970bdf91658f"
    description: "Monitor lizards are charismatic, surprisingly diverse, full of surprising biological features, and on top of all that, they include the largest terrestrial lizards in history. Also, they’re closely related to snakes (it is Snake Month, after all). That’s a cool group of lizards! In this episode, we discuss what makes these lizards so unique and fascinating, and we dive into their long but often mysterious fossil record to address some major questions about monitor evolution.\nIn the news: vampire squids, dinosaur eggs, octopus intelligence, and pickled snakes.\nTime markers:\nIntro & Announcements: 00:00:00\nNews: 00:06:45\nMain discussion, Part 1: 00:38:00\nMain discussion, Part 2: 01:19:30\nPatron question: 01:57:00\nIT’S SNAKE MONTH! Check out our Snake Month activities on our social media, Discord, and Patreon!\nLinks to the organizations we mentioned in the Intro:\nNational Network of Abortion Funds: https://abortionfunds.org/about/\nAnswer: https://answer.rutgers.edu/page/aboutusintro\nCheck out our blog for bonus info and pictures:\nhttp://commondescentpodcast.wordpress.com/\nJoin us on Patreon to support the podcast and enjoy bonus content! https://www.patreon.com/commondescentpodcast\nOr make a one-time donation via PayPal: https://tinyurl.com/4c68u4hp\nFind merch at the Common Descent Store! http://zazzle.com/common_descent\nJoin the Common Descent Discord server! https://discord.gg/CwPBxdh9Ev\nFollow and Support us on:\nTwitter: https://twitter.com/CommonDescentPC\nFacebook: https://www.facebook.com/commondescentpodcast\nInstagram: @commondescentpodcast\nYouTube: https://www.youtube.com/channel/UCePRXHEnZmTGum2r1l2mduw\nPodBean: https://commondescentpodcast.podbean.com/\niTunes: https://itunes.apple.com/us/podcast/the-common-descent-podcast/id1207586509?mt=2\nYou can email us at commondescentpodcast(at)gmail.com\nOr send us physical mail at:\nThe Common Descent Podcast\n1735 W State of Franklin Rd. Ste 5 #165\nJohnson City, TN 37604\nThe