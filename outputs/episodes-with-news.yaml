    title: "The Burgess Shale"
    original_title: "Episode 89 - The Burgess Shale"
    date: "2020-06-13"
    published_raw: "Sat, 13 Jun 2020 19:20:37 -0500"
    type: "Main"
    rss_episode_type: "full"
    page_url: "https://commondescentpodcast.podbean.com/e/episode-89-the-burgess-shale/"
