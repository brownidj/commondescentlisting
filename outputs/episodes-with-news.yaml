    guid: "commondescentpodcast.podbean.com/166a511d-cec1-3fcf-92f2-5bde75d9c986"
    description: "Every period of geologic time is distinguished by its own environmental and ecological features, and every boundary between time periods is characterized by change. The boundary between the Jurassic Period and the Cretaceous Period is mostly marked by mystery. Was there a mass extinction? Were there catastrophic changes? Where even is the boundary exactly? In this episode, we’ll discuss the answers – or lack thereof – to these questions and more as we explore this surprisingly enigmatic time in Earth history.\nIn the news: croc conservation, diving whales, aquatic mammal-cousins, and sauropod feet.\nTime markers:\nIntro & Announcements: 00:00:00\nNews: 00:06:15\nMain discussion, Part 1: 00:36:30\nMain discussion, Part 2: 01:00:30\nPatron question: 01:33:30\nWe recently appeared on the Juras-Sick-Park-Cast!\nhttps://jurassickparkcast.blogspot.com/2022/07/episode-20-when-dinosaurs-ruled-earth.html\nCheck out our blog for bonus info and pictures:\nhttp://commondescentpodcast.wordpress.com/\nJoin us on Patreon to support the podcast and enjoy bonus content! https://www.patreon.com/commondescentpodcast\nOr make a one-time donation via PayPal: https://tinyurl.com/4c68u4hp\nFind merch at the Common Descent Store! http://zazzle.com/common_descent\nJoin the Common Descent Discord server! https://discord.gg/CwPBxdh9Ev\nFollow and Support us on:\nTwitter: https://twitter.com/CommonDescentPC\nFacebook: https://www.facebook.com/commondescentpodcast\nInstagram: @commondescentpodcast\nYouTube: https://www.youtube.com/channel/UCePRXHEnZmTGum2r1l2mduw\nPodBean: https://commondescentpodcast.podbean.com/\niTunes: https://itunes.apple.com/us/podcast/the-common-descent-podcast/id1207586509?mt=2\nYou can email us at commondescentpodcast(at)gmail.com\nOr send us physical mail at:\nThe Common Descent Podcast\n1735 W State of Franklin Rd. Ste 5 #165\nJohnson City, TN 37604\nThe Intro and Outro music is “On the Origin of Species” by Protodome.\nMore music like this at http: