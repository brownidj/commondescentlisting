    title: "Decomposers"
    original_title: "Episode 213 - Decomposers"
    date: "2025-03-15"
    published_raw: "Sat, 15 Mar 2025 19:00:00 -0500"
    type: "Main"
    rss_episode_type: "full"
    page_url: "https://commondescentpodcast.podbean.com/e/episode-213-decomposers/"
    audio_url: "https://mcdn.podbean.com/mf/web/hufw38tyxgut2ft8/Episode_213_Decomposers.mp3"
    guid: "commondescentpodcast.podbean.com/636d3441-fc3d-37f9-ba19-0b38a93eb339"
    description: "Leave a carcass or a log or a pile of poop out in the wild long enough and it will break down into its component parts. Decomposers are an often-overlooked but essential component of ecosystems past and present. This episode, we explore the varied processes of decomposition and how scientists study decomposers and use that information. We’ll also discuss the importance of decomposition to the fossil record, as well as how we can identify signs of decomposers from the distant past.\nIn the news: temnospondyl extinction, hot crocs, foraging birds, narwhal tusks, and giant flying squirrels.\nTime markers:\nIntro & Announcements: 00:00:00\nNews: 00:06:55\nMain discussion, Part 1: 00:44:45\nMain discussion, Part 2: 01:28:05\nPatron question: 02:12:30\nCheck out our website for this episode’s blog post and more: http://commondescentpodcast.com/\nJoin us on Patreon to support the podcast and enjoy bonus content: https://www.patreon.com/commondescentpodcast\nGot a topic you want to hear about? Submit your episode request here: https://commondescentpodcast.com/request-a-topic/\nLots more ways to connect with us: https://linktr.ee/common_descent\nThe Intro and Outro music is “On the Origin of Species” by Protodome. More music like this at http://ocremix.org\nMusical Interludes are \"Professor Umlaut\" by Kevin MacLeod (incompetech.com). Licensed under Creative Commons: By Attribution 3.0 http://creativecommons.org/licenses/by/3.0"
