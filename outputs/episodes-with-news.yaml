    title: "Feathers"
    original_title: "Episode 183 - Feathers"
    date: "2024-01-20"
    published_raw: "Sat, 20 Jan 2024 20:00:00 -0500"
    type: "Main"
    rss_episode_type: "full"
    page_url: "https://commondescentpodcast.podbean.com/e/episode-183-feathers/"
    audio_url: "https://mcdn.podbean.com/mf/web/zgvndm/Episode_183_Feathers.mp3"
    guid: "commondescentpodcast.podbean.com/de334ac2-ef0a-3241-968a-97e4de365373"
    description: "Feathers are among the most diverse and complex forms of animal integument. Today, they’re exclusive to birds, where they can be found in a dizzying variety of forms and functions, and incredible fossils reveal even more diversity of feathers on ancient dinosaurs. This episode, we explore the features of modern feathers, the mysteries of feather origins, and the much-discussed question of which ancient animals were truly feathered.\nIn the news: sturdy bird necks, giant worms, early photosynthesis, and very old skin.\nTime markers:\nIntro & Announcements: 00:00:00\nNews: 00:06:20\nMain discussion, Part 1: 00:37:00\nMain discussion, Part 2: 01:15:55\nPatron question: 02:11:30\nCheck out our website for this episode’s blog post and more: http://commondescentpodcast.com/\nJoin us on Patreon to support the podcast and enjoy bonus content: https://www.patreon.com/commondescentpodcast\nGot a topic you want to hear about? Submit your episode request here: https://commondescentpodcast.com/request-a-topic/\nWe’re an Audible Affiliate Partner! Use this link for a 30-day free trial to Audible: https://www.audibletrial.com/CommonDescent\nLots more ways to connect with us: https://linktr.ee/common_descent\nThe Intro and Outro music is “On the Origin of Species” by Protodome. More music like this at http://ocremix.org.\nMusical Interludes are \"Professor Umlaut\" by Kevin MacLeod (incompetech.com). Licensed under Creative Commons: By Attribution 3.0 http://creativecommons.org/licenses/by/3.0/"
