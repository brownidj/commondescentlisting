    original_title: "Episode 197 - Durophagy (Eating Hard Stuff)"
    date: "2024-08-03"
    published_raw: "Sat, 03 Aug 2024 19:00:00 -0500"
    type: "Main"
    rss_episode_type: "full"
    page_url: "https://commondescentpodcast.podbean.com/e/episode-197-durophagy-eating-hard-stuff/"
    audio_url: "https://mcdn.podbean.com/mf/web/vqmz7rsze36jiwhw/Episode_197_Durophagy.mp3"
    guid: "commondescentpodcast.podbean.com/fc383995-5e42-334a-8cc9-6fdca942164b"
    description: "Some animals are specialists at eating particularly tough foods like shells, seeds, and bones. Adaptations for a durophagous diet come in many forms in almost all major groups of life. This episode, we discuss how so many animals tackle tough foods, what behaviors and anatomy help them to do it, and the importance of durophagy for understanding fossils and the history of Earth ecosystems.\nIn the news: fossil boas, walking fish, cooked birds, and early arthropods.\nTime markers:\nIntro & Announcements: 00:00:00\nNews: 00:08:15\nMain discussion, Part 1: 00:45:50\nMain discussion, Part 2: 01:28:45\nPatron question: 02:06:30\nCheck out our website for this episode’s blog post and more: http://commondescentpodcast.com/\nJoin us on Patreon to support the podcast and enjoy bonus content: https://www.patreon.com/commondescentpodcast\nGot a topic you want to hear about? Submit your episode request here: https://commondescentpodcast.com/request-a-topic/\nLots more ways to connect with us: https://linktr.ee/common_descent\nThe Intro and Outro music is “On the Origin of Species” by Protodome. More music like this at http://ocremix.org\nMusical Interludes are \"Professor Umlaut\" by Kevin MacLeod (incompetech.com). Licensed under Creative Commons: By Attribution 3.0 http://creativecommons.org/licenses/by/3.0"
