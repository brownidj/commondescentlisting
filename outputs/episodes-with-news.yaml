    title: "Coelacanths"
    original_title: "Episode 83 - Coelacanths"
    date: "2020-03-21"
    published_raw: "Sat, 21 Mar 2020 20:00:00 -0500"
    type: "Main"
    rss_episode_type: "full"
    page_url: "https://commondescentpodcast.podbean.com/e/episode-83-coelacanths/"
    audio_url: "https://mcdn.podbean.com/mf/web/46tq6u/Episode_83_-_Coelacanths.mp3"
    guid: "commondescentpodcast.podbean.com/5f3761f0-97c3-5372-90d5-8d867b7228cb"
    description: "In 1938, a fishing crew pulled up a fish that everyone thought had been extinct for 70 million years. Since then, coelacanths have become famous not just for their strangely incomplete fossil record, but also for their unique anatomy, their reclusive lifestyle, and their close relationship to land vertebrates. From fossils to genetics, this episode is all about what we know – and what we’re missing – of the story of coelacanths.\nIn the news: an old weasel, fish through time, daily bivalve growth, and cave cockroaches.\nTime markers:\nIntro & Announcements: 00:00:00\nNews: 00:06:00\nMain discussion, Part 1: 00:34:30\nMain discussion, Part 2: 01:03:00\nPatron question: 01:36:00\nCheck out our blog for bonus info and pictures:\nhttp://commondescentpodcast.wordpress.com/\nThe Common Descent Store is open! Get merch! http://zazzle.com/common_descent\nFollow and Support us on:\nPatreon: https://www.patreon.com/commondescentpodcast\nTwitter: https://twitter.com/CommonDescentPC\nFacebook: https://www.facebook.com/commondescentpodcast\nInstagram: @commondescentpodcast\nPodBean: https://commondescentpodcast.podbean.com/\niTunes: https://itunes.apple.com/us/podcast/the-common-descent-podcast/id1207586509?mt=2\nYouTube: https://www.youtube.com/channel/UCePRXHEnZmTGum2r1l2mduw\nThe Intro and Outro music is “On the Origin of Species” by Protodome.\nMore music like this at http://ocremix.org.\nMusical Interludes are \"Professor Umlaut\" by Kevin MacLeod (incompetech.com). Licensed under Creative Commons: By Attribution 3.0\nhttp://creativecommons.org/licenses/by/3.0/"
