    title: "Caecilians"
    original_title: "Episode 162 – Caecilians"
    date: "2023-04-01"
    published_raw: "Sat, 01 Apr 2023 19:00:00 -0500"
    type: "Main"
    rss_episode_type: "full"
    page_url: "https://commondescentpodcast.podbean.com/e/episode-162-%e2%80%93-caecilians/"
    audio_url: "https://mcdn.podbean.com/mf/web/k6is95/Episode_162_Caecilians.mp3"
    guid: "commondescentpodcast.podbean.com/8bd2db62-2341-35c2-8a01-6731910be3df"
    description: "You’re probably familiar with frogs and salamanders, but there is a third group of modern amphibians, the strangest of them all: the worm-like caecilians. In this episode, we’ll explore the many bizarre anatomical features of caecilians, from their tentacled faces to their abrupt hind ends. Then we’ll explore the entire caecilian fossil record (it won’t take long) and tackle the much-discussed mystery of how this fascinating lineage of amphibians got started.\nIn the news: weird marsupial eyes, long dinosaur necks, and kangaroo rats. Also a retraction!\nTime markers:\nIntro & Announcements: 00:00:00\nNews: 00:05:00\nMain discussion, Part 1: 00:43:30\nMain discussion, Part 2: 01:22:30\nPatron question: 01:59:30\nHUGE THANKS to our News guests, Sabrina and Garret!\nCheck out I Know Dino: https://iknowdino.com/\nAnd they have a Patreon! https://www.patreon.com/iknowdino\nCheck out our blog for bonus info and pictures:\nhttp://commondescentpodcast.com/\nJoin us on Patreon to support the podcast and enjoy bonus content! https://www.patreon.com/commondescentpodcast\nFollow this link for a 30-day free trial to Audible!\nwww.audibletrial.com/CommonDescent\nOr make a one-time donation via PayPal: https://tinyurl.com/4c68u4hp\nFind merch at the Common Descent Store! http://zazzle.com/common_descent\nJoin the Common Descent Discord server! https://discord.gg/CwPBxdh9Ev\nFollow and Support us on:\nTwitter: https://twitter.com/CommonDescentPC\nFacebook: https://www.facebook.com/commondescentpodcast\nInstagram: @commondescentpodcast\nYouTube: https://www.youtube.com/channel/UCePRXHEnZmTGum2r1l2mduw\nPodBean: https://commondescentpodcast.podbean.com/\niTunes: https://itunes.apple.com/us/podcast/the-common-descent-podcast/id1207586509?mt=2\nYou can email us at commondescentpodcast(at)gmail.com\nOr send us physical mail at:\nThe Common Descent Podcast\n1735 W State of Franklin Rd. Ste 5 #165\nJohnson City, TN 37604\nThe Intro and Outro music is “On the Origin of Sp