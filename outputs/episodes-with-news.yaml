  - episode_number: "116"
    rss_episode_number: "171"
    title: "Ichthyosaurs"
    original_title: "Episode 116 - Ichthyosaurs"
    date: "2021-06-26"
    published_raw: "Sat, 26 Jun 2021 19:56:42 -0500"
    type: "Main"
    rss_episode_type: "full"
    page_url: "https://commondescentpodcast.podbean.com/e/episode-116-ichthyosaurs/"
    audio_url: "https://mcdn.podbean.com/mf/web/5hven7/Episode_116_Ichthyosaurs.mp3"
    guid: "commondescentpodcast.podbean.com/9fec7d20-df29-31fe-bb73-6a9580fdd991"
    description: "The history of evolution has seen many land animals move to the sea, but few have done it with such success and specialization as ichthyosaurs. These Mesozoic marine reptiles were the first group of tetrapods to truly dominate the marine realm, and they evolved some of the most extreme adaptations – and largest bodies – of any ocean-dwelling tetrapods. This episode, we discuss how they got started, what they did, where they went, and why they’re so incredibly famous.\nIn the news: giant crocs, giant rhinos, young tyrannosaurs, and dwarf elephants.\nTime markers:\nIntro & Announcements: 00:00:00\nNews: 00:04:00\nMain discussion, Part 1: 00:32:00\nMain discussion, Part 2: 01:15:00\nPatron question: 01:59:30\nCheck out our blog for bonus info and pictures:\nhttp://commondescentpodcast.wordpress.com/\nFind merch at the Common Descent Store! http://zazzle.com/common_descent\nFollow and Support us on:\nPatreon: https://www.patreon.com/commondescentpodcast\nTwitter: https://twitter.com/CommonDescentPC\nFacebook: https://www.facebook.com/commondescentpodcast\nInstagram: @commondescentpodcast\nYouTube: https://www.youtube.com/channel/UCePRXHEnZmTGum2r1l2mduw\nPodBean: https://commondescentpodcast.podbean.com/\niTunes: https://itunes.apple.com/us/podcast/the-common-descent-podcast/id1207586509?mt=2\nThe Intro and Outro music is “On the Origin of Species” by Protodome.\nMore music like this at http://ocremix.org.\nMusical Interludes are \"Professor Umlaut\" by Kevin MacLeod (incompetech.com). Licensed under Creative Commons: By Attribution 3.0\nhttp://creativecommons.org/licenses/by/3.0/"
