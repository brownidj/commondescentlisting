  - episode_number: "165"
    rss_episode_number: "238"
    title: "Fruit"
    original_title: "Episode 165 - Fruit"
    date: "2023-05-13"
    published_raw: "Sat, 13 May 2023 19:00:00 -0500"
    type: "Main"
    rss_episode_type: "full"
    page_url: "https://commondescentpodcast.podbean.com/e/episode-165-fruit/"
    audio_url: "https://mcdn.podbean.com/mf/web/wxardv/Episode_165_Fruit.mp3"
    guid: "commondescentpodcast.podbean.com/2d39696e-3b60-3d79-9e5e-d44bcde2f667"
    description: "One of the hallmarks of angiosperms (flowering plants) is the formation of a container to hold their seeds. These containers are fruits, and they come in an astonishing variety of forms and functions, far beyond the typical line up of fruits, nuts, and berries we see at the grocery store. Join us and our favorite paleobotanist Dr. Aly Baumgartner as we explore what fruits are, what fruits do, and how fruits came to be so ubiquitous and important in modern ecosystems.\nIn the news: big predatory amphibians, exceptional fossil preservation, origins of blinking, and cycad cones.\nTime markers:\nIntro & Announcements: 00:00:00\nNews: 00:05:45\nMain discussion, Part 1: 00:40:30\nMain discussion, Part 2: 01:36:30\nPatron question: 02:14:15\nCheck out our blog for bonus info and pictures:\nhttp://commondescentpodcast.com/\nJoin us on Patreon to support the podcast and enjoy bonus content! https://www.patreon.com/commondescentpodcast\nFollow this link for a 30-day free trial to Audible!\nwww.audibletrial.com/CommonDescent\nOr make a one-time donation via PayPal: https://tinyurl.com/4c68u4hp\nFind merch at the Common Descent Store! http://zazzle.com/common_descent\nJoin the Common Descent Discord server! https://discord.gg/CwPBxdh9Ev\nFollow and Support us on:\nTwitter: https://twitter.com/CommonDescentPC\nFacebook: https://www.facebook.com/commondescentpodcast\nInstagram: @commondescentpodcast\nYouTube: https://www.youtube.com/channel/UCePRXHEnZmTGum2r1l2mduw\nPodBean: https://commondescentpodcast.podbean.com/\niTunes: https://itunes.apple.com/us/podcast/the-common-descent-podcast/id1207586509?mt=2\nYou can email us at commondescentpodcast(at)gmail.com\nOr send us physical mail at:\nThe Common Descent Podcast\n1735 W State of Franklin Rd. Ste 5 #165\nJohnson City, TN 37604\nThe Intro and Outro music is “On the Origin of Species” by Protodome.\nMore music like this at http://ocremix.org.\nMusical Interludes are \"Professor Umlaut\" by Kevin MacLeod (incompe