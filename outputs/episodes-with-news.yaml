    guid: "commondescentpodcast.podbean.com/7b230303-748c-5a95-89c4-d49b396381d0"
    description: "In the Canadian Rockies of British Columbia sits one of the most important, well-studied, and scientifically influential fossil sites in the world. The Burgess Shale not only provides us a glimpse into the tail end of the Cambrian Explosion, and not only yields tens of thousands of fossil specimens, but also includes some of the most exceptional fossil preservation of any fossil locality anywhere. This episode, we’ll dive into how it got that way, and what it has to tell us about some of Earth's earliest animal communities.\nIn the news: baby sharks, hungry dinosaurs, a pregnant ichthyosaur, and one dino’s last meal.\nTime markers:\nIntro & Announcements: 00:00:00\nNews: 00:06:30\nMain discussion, Part 1: 00:34:00\nMain discussion, Part 2: 01:00:00\nPatron question: 01:37:00\nIn light of current events, we invite you to explore these links to educate yourself, as we have been doing, about the subject of racial injustice:\nSmithsonian NMAAHC - Talking About Race\nhttps://nmaahc.si.edu/learn/talking-about-race\nTimeScavengers - Black Lives Matter\nhttps://timescavengers.blog/2020/06/01/black-lives-matter/\nAlly Anti-Racism Resources\nhttps://docs.google.com/document/d/1MjUESaOh2H-846KKiHUWHDUIhi3PlaFts-rqy9EQ43g/edit#\nWe’ve also made a donation to the NAACP Legal Defense & Education Fund:\nhttps://www.naacpldf.org/\nCheck out our blog for bonus info and pictures:\nhttp://commondescentpodcast.wordpress.com/\nNew merch at the Common Descent Store! http://zazzle.com/common_descent\nFeaturing art by Rob Soto! https://www.rob-soto.com/\nFollow and Support us on:\nPatreon: https://www.patreon.com/commondescentpodcast\nTwitter: https://twitter.com/CommonDescentPC\nFacebook: https://www.facebook.com/commondescentpodcast\nInstagram: @commondescentpodcast\nPodBean: https://commondescentpodcast.podbean.com/\niTunes: https://itunes.apple.com/us/podcast/the-common-descent-podcast/id1207586509?mt=2\nYouTube: https://www.youtube.com/channel/UCePRXHEnZmTGum2r1l2mduw\nThe Intro and Outro music is “On the Origin of Species” by Protodome.\nMore music like this at http://ocremix.org.\nMusical Interludes are \"Professor Umlaut\" by Kevin MacLeod (incompetech.com). Licensed under Creative Commons: By Attribution 3.0\nhttp://creativecommons.org/licenses/by/3.0/"
