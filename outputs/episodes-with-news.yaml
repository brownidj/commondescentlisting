  - episode_number: "170"
    rss_episode_number: "245"
    title: "Milk"
    original_title: "Episode 170 - Milk"
    date: "2023-07-22"
    published_raw: "Sat, 22 Jul 2023 19:00:00 -0500"
    type: "Main"
    rss_episode_type: "full"
    page_url: "https://commondescentpodcast.podbean.com/e/episode-170-milk/"
    audio_url: "https://mcdn.podbean.com/mf/web/kdyirs/Episode_170_Milk.mp3"
    guid: "commondescentpodcast.podbean.com/27957a09-c6c9-3ce3-a9d8-2396002494cc"
    description: "Mammals are famous for their ability to produce milk, a special substance that is essential for providing newborns with the ingredients they need for healthy development. As it turns out, mammals aren’t the only ones. Milk-like substances have evolved in many groups of animals which nourish their developing young. In this episode, we discuss what milk is, what it does, how it seems to have evolved, and the surprisingly long list of times animals have evolved the habit of providing nutritious fluids to feed their offspring.\nIn the news: Anomalocaris diets, Asian alligators, ancient puberty, and the Cambrian Explosion.\nTime markers:\nIntro & Announcements: 00:00:00\nNews: 00:05:55\nMain discussion, Part 1: 00:41:30\nMain discussion, Part 2: 01:29:35\nPatron question: 02:04:10\nCheck out our blog for bonus info and pictures:\nhttp://commondescentpodcast.com/\nJoin us on Patreon to support the podcast and enjoy bonus content! https://www.patreon.com/commondescentpodcast\nListen to David talk about snake paleontology on Snake Talk!\nhttps://www.oriannesociety.org/snake-talk/\nListen to Will and David discuss the evolution of flight on Little Curiosities!\nhttps://listen.qcodemedia.com/littlecuriosities\nWe’re an Audible Affiliate Partner! Use this link for a 30-day free trial to Audible: https://www.audibletrial.com/CommonDescent\nOr make a one-time donation via PayPal: https://tinyurl.com/4c68u4hp\nFind merch at the Common Descent Store! http://zazzle.com/common_descent\nJoin the Common Descent Discord server! https://discord.gg/CwPBxdh9Ev\nFollow and Support us on:\nTwitter: https://twitter.com/CommonDescentPC\nFacebook: https://www.facebook.com/commondescentpodcast\nInstagram: https://www.instagram.com/commondescentpodcast/\nYouTube: https://www.youtube.com/channel/UCePRXHEnZmTGum2r1l2mduw\nPodBean: https://commondescentpodcast.podbean.com/\nYou can email us at commondescentpodcast(at)gmail.com\nOr send us physical mail at:\nThe Common Descent Podc