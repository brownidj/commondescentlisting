  - episode_number: "113"
    rss_episode_number: "166"
    title: "Paleoclimate"
    original_title: "Episode 113 - Paleoclimate"
    date: "2021-05-15"
    published_raw: "Sat, 15 May 2021 19:51:39 -0500"
    type: "Main"
    rss_episode_type: "full"
    page_url: "https://commondescentpodcast.podbean.com/e/episode-113-paleoclimate/"
