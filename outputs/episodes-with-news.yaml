  - episode_number: "153"
    rss_episode_number: "224"
    title: "Armadillos"
    original_title: "Episode 153 - Armadillos"
    date: "2022-11-26"
    published_raw: "Sat, 26 Nov 2022 20:10:00 -0500"
    type: "Main"
    rss_episode_type: "full"
    page_url: "https://commondescentpodcast.podbean.com/e/episode-153-armadillos/"
    audio_url: "https://mcdn.podbean.com/mf/web/h6whr5/Episode_153_Armadillos.mp3"
    guid: "commondescentpodcast.podbean.com/830995a0-705d-3c42-a57e-bad033865ad8"
    description: "Built-in body armor is common among reptiles and rare among mammals, but armadillos are the major exception. Equipped with a full set of segmented armor over their heads, backs, and tails, armadillos have been waddling around well-protected for tens of millions of years, and their ancient relatives include some of the most famous and preposterous of extinct mammals. This episode, we discuss the unique features and fascinating history of armadillos, glyptodonts, and their other ancient cousins.\nIn the news: roots and extinction, new croc-like reptiles, early cooking, and giant turtles.\nTime markers:\nIntro & Announcements: 00:00:00\nNews: 00:04:00\nMain discussion, Part 1: 00:31:30\nMain discussion, Part 2: 01:05:30\nPatron question: 01:39:30\nCheck out our blog for bonus info and pictures:\nhttp://commondescentpodcast.wordpress.com/\nThe 2022 End of the Year Q&A Form is LIVE! Submit your question now!\nhttps://forms.gle/GTgew75GmVxAKejt6\nFollow this link for a 30-day free trial to Audible!\nwww.audibletrial.com/CommonDescent\nJoin us on Patreon to support the podcast and enjoy bonus content! https://www.patreon.com/commondescentpodcast\nOr make a one-time donation via PayPal: https://tinyurl.com/4c68u4hp\nFind merch at the Common Descent Store! http://zazzle.com/common_descent\nJoin the Common Descent Discord server! https://discord.gg/CwPBxdh9Ev\nFollow and Support us on:\nTwitter: https://twitter.com/CommonDescentPC\nFacebook: https://www.facebook.com/commondescentpodcast\nInstagram: @commondescentpodcast\nYouTube: https://www.youtube.com/channel/UCePRXHEnZmTGum2r1l2mduw\nPodBean: https://commondescentpodcast.podbean.com/\niTunes: https://itunes.apple.com/us/podcast/the-common-descent-podcast/id1207586509?mt=2\nYou can email us at commondescentpodcast(at)gmail.com\nOr send us physical mail at:\nThe Common Descent Podcast\n1735 W State of Franklin Rd. Ste 5 #165\nJohnson City, TN 37604\nThe Intro and Outro music is “On the Origin of Species” by