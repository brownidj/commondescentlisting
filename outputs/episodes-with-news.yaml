    title: "Alfred Russell Wallace"
    original_title: "Episode 54 - Alfred Russell Wallace"
    date: "2019-02-09"
    published_raw: "Sat, 09 Feb 2019 20:05:53 -0500"
    type: "Main"
    rss_episode_type: "full"
    page_url: "https://commondescentpodcast.podbean.com/e/episode-54-alfred-russell-wallace/"
    audio_url: "https://mcdn.podbean.com/mf/web/9k8whq/Episode_54_-_Alfred_Russel_Wallace.mp3"
    guid: "commondescentpodcast.podbean.com/episode-54-alfred-russell-wallace-6db090f54c04b34e2f1abdfefcb67c97"
    description: "Happy Darwin Day! Last year around this time, we were joined by Dr. Sarah Bray to discuss the life and times of Charles Darwin. This time, Sarah joins us again to discuss his colleague and natural selection co-discoverer, Alfred Russell Wallace. In 1858, the year before Darwin published his famous book, he received a letter from a young, adventurous, sometimes tragic man in the throes of illness in southeast Asia. To Darwin’s shock, the letter included precisely the same biological insights he had been working on. That letter came from Alfred Russell Wallace.\nFind Sarah and her colleagues on the podcast Discovering Darwin! http://discoveringdarwin.blogspot.com/\nIn the news: fast-evolving mice, a small-headed reptile, an early Antarctic archosaur, and really old amoebae.\nTime markers:\nIntro & Announcements: 00:00:00\nNews: 00:05:00\nMain discussion, Part 1: 00:39:00\nMain discussion, Part 2: 01:23:30\nCheck out our blog for bonus info and pictures:\nhttp://commondescentpodcast.wordpress.com/\nFollow and Support us on:\nPatreon: https://www.patreon.com/commondescentpodcast\nTwitter: https://twitter.com/CommonDescentPC\nFacebook: https://www.facebook.com/commondescentpodcast/\nPodBean: https://commondescentpodcast.podbean.com/\niTunes: https://itunes.apple.com/us/podcast/the-common-descent-podcast/id1207586509?mt=2\nYouTube: https://www.youtube.com/channel/UCePRXHEnZmTGum2r1l2mduw\nThe Intro and Outro music is “On the Origin of Species” by Protodome.\nMore music like this at http://ocremix.org.\nMuscial Interludes are \"Professor Umlaut\" by Kevin MacLeod (incompetech.com). Licensed under Creative Commons: By Attribution 3.0\nhttp://creativecommons.org/licenses/by/3.0/"
