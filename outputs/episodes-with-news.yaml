  - episode_number: "111"
    rss_episode_number: "164"
    title: "Eusociality"
    original_title: "Episode 111 - Eusociality"
    date: "2021-04-17"
    published_raw: "Sat, 17 Apr 2021 19:09:32 -0500"
    type: "Main"
    rss_episode_type: "full"
    page_url: "https://commondescentpodcast.podbean.com/e/episode-111-eusociality/"
    audio_url: "https://mcdn.podbean.com/mf/web/6s4ck5/Episode_111_Eusociality.mp3"
    guid: "commondescentpodcast.podbean.com/3308d527-884f-371c-b558-070f442d5327"
    description: "There isn’t much on Earth quite like an ant colony or a beehive. Lots of animals are social, but relatively few are eusocial. It’s a bizarre lifestyle, living in large multi-generational colonies with lots of members who don’t reproduce but instead dedicate their lives to protecting and nourishing the offspring of the few reproducers. In this episode, we discuss the many questions surrounding this phenomenon, including how many times this trait has evolved, why it’s apparently so beneficial, and exactly how natural selection could even produce such a strange lifestyle.\nIn the news: venom evolution, pointy things, early rainforests, and bone origins.\nTime markers:\nIntro & Announcements: 00:00:00\nNews: 00:05:00\nMain discussion, Part 1: 00:39:00\nMain discussion, Part 2: 01:15:00\nPatron question: 02:02:00\nCheck out our blog for bonus info and pictures:\nhttp://commondescentpodcast.wordpress.com/\nFind merch at the Common Descent Store! http://zazzle.com/common_descent\nFollow and Support us on:\nPatreon: https://www.patreon.com/commondescentpodcast\nTwitter: https://twitter.com/CommonDescentPC\nFacebook: https://www.facebook.com/commondescentpodcast\nInstagram: @commondescentpodcast\nYouTube: https://www.youtube.com/channel/UCePRXHEnZmTGum2r1l2mduw\nPodBean: https://commondescentpodcast.podbean.com/\niTunes: https://itunes.apple.com/us/podcast/the-common-descent-podcast/id1207586509?mt=2\nThe Intro and Outro music is “On the Origin of Species” by Protodome.\nMore music like this at http://ocremix.org.\nMusical Interludes are \"Professor Umlaut\" by Kevin MacLeod (incompetech.com). Licensed under Creative Commons: By Attribution 3.0\nhttp://creativecommons.org/licenses/by/3.0/"
