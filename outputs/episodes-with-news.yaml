    description: "The island of Madagascar, isolated from all other landmasses on Earth, hosts one of the planet’s most unique ecosystems. But it’s not just an interesting place today – the geologic and fossil history of this land is equally fascinating! In this episode, we take a tour through time, stopping off at some of Madagascar’s most magical moments to marvel at some truly unique and incredible assortments of life.\nIn the news: an early giant dinosaur, more on human origins, ancient fish appendages, and a baby snake in amber!\nTime markers:\nIntro & Announcements: 00:00:00\nNews: 00:06:00\nMain discussion, Part 1: 00:37:30\nMain discussion, Part 2: 01:07:00\nCheck out our blog for bonus info and pictures:\nhttp://commondescentpodcast.wordpress.com/\nFollow and Support us on:\nPatreon: https://www.patreon.com/commondescentpodcast\nTwitter: https://twitter.com/CommonDescentPC\nFacebook: https://www.facebook.com/commondescentpodcast/\nPodBean: https://commondescentpodcast.podbean.com/\niTunes: https://itunes.apple.com/us/podcast/the-common-descent-podcast/id1207586509?mt=2\nYouTube: https://www.youtube.com/channel/UCePRXHEnZmTGum2r1l2mduw\nThe Intro and Outro music is “On the Origin of Species” by Protodome.\nMore music like this at http://ocremix.org.\nMuscial Interludes are \"Professor Umlaut\" by Kevin MacLeod (incompetech.com). Licensed under Creative Commons: By Attribution 3.0\nhttp://creativecommons.org/licenses/by/3.0/"
