    title: "Trilobites"
    original_title: "Episode 82 - Trilobites"
    date: "2020-03-07"
    published_raw: "Sat, 07 Mar 2020 22:36:08 -0500"
    type: "Main"
    rss_episode_type: "full"
    page_url: "https://commondescentpodcast.podbean.com/e/episode-82-trilobites/"
    audio_url: "https://mcdn.podbean.com/mf/web/xmq6f5/Episode_82_-_Trilobites.mp3"
    guid: "commondescentpodcast.podbean.com/2fa270f4-f471-545f-bb26-f669f9706592"
    description: "Few fossil animals are as popular with the public, as abundant in the fossil record, or as important to the study of past life on Earth as trilobites. These ocean-dwelling arthropods came in an amazing variety of shapes, sizes, and lifestyles, with many thousands of identified species, and they persisted on our planet for more than 270 million years. And best of all, they left behind an incredible fossil record giving us insights into their evolution, life history, and ultimate extinction.\nIn the news: evolution of gliders, a weird worm, tiny marsupial lions, and dino DNA?\nTime markers:\nIntro & Announcements: 00:00:00\nNews: 00:05:00\nMain discussion, Part 1: 00:36:30\nMain discussion, Part 2: 01:10:30\nPatron question: 01:51:30\nCheck out our blog for bonus info and pictures:\nhttp://commondescentpodcast.wordpress.com/\nThe Common Descent Store is open! Get merch! http://zazzle.com/common_descent\nFollow and Support us on:\nPatreon: https://www.patreon.com/commondescentpodcast\nTwitter: https://twitter.com/CommonDescentPC\nFacebook: https://www.facebook.com/commondescentpodcast\nInstagram: @commondescentpodcast\nPodBean: https://commondescentpodcast.podbean.com/\niTunes: https://itunes.apple.com/us/podcast/the-common-descent-podcast/id1207586509?mt=2\nYouTube: https://www.youtube.com/channel/UCePRXHEnZmTGum2r1l2mduw\nThe Intro and Outro music is “On the Origin of Species” by Protodome.\nMore music like this at http://ocremix.org.\nMusical Interludes are \"Professor Umlaut\" by Kevin MacLeod (incompetech.com). Licensed under Creative Commons: By Attribution 3.0\nhttp://creativecommons.org/licenses/by/3.0/"
