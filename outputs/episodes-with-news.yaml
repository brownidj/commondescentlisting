    guid: "commondescentpodcast.podbean.com/cd68ac30-2242-32e6-b2b5-3ecde5b2eec3"
    description: "For most of the Cenozoic Era, South America was home to an incredible group of predatory birds called phorusrhacids, which included some of the largest carnivorous birds of all time. With their giant axe-like beaks and powerful clawed legs, these giants have gained the nickname “terror birds.” This episode, we explore what makes these birds unique, how they varied across their diversity, and what exactly they were doing with all those terrifying tools.\nIn the news: a bitten plesiosaur, wildflower adaptation, a new croc, and dinosaur parents.\nTime markers:\nIntro & Announcements: 00:00:00\nNews: 00:06:25\nMain discussion, Part 1: 00:51:30\nMain discussion, Part 2: 01:29:30\nPatron question: 02:30:05\nSome helpful links mentioned in the Announcements:\nThe Trevor Project: https://www.thetrevorproject.org/\nThe National Immigrant Justice Center: https://immigrantjustice.org/\nPal Humanity: https://chuffed.org/project/122818-support-north-gaza-rebuilding-lives-restoring-hope-with-pal-humanity?utm_source=ig&utm_medium=social&utm_content=link_in_bio\nCheck out our website for this episode’s blog post and more: http://commondescentpodcast.com/\nJoin us on Patreon to support the podcast and enjoy bonus content: https://www.patreon.com/commondescentpodcast\nGot a topic you want to hear about? Submit your episode request here: https://commondescentpodcast.com/request-a-topic/\nLots more ways to connect with us: https://linktr.ee/common_descent\nThe Intro and Outro music is “On the Origin of Species” by Protodome. More music like this at http://ocremix.org\nMusical Interludes are \"Professor Umlaut\" by Kevin MacLeod (incompetech.com). Licensed under Creative Commons: By Attribution 3.0 http://creativecommons.org/licenses/by/3.0"
