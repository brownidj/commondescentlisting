  - episode_number: "154"
    rss_episode_number: "225"
    title: "Live Birth"
    original_title: "Episode 154 - Live Birth"
    date: "2022-12-10"
    published_raw: "Sat, 10 Dec 2022 20:00:00 -0500"
    type: "Main"
    rss_episode_type: "full"
    page_url: "https://commondescentpodcast.podbean.com/e/episode-154-live-birth/"
    audio_url: "https://mcdn.podbean.com/mf/web/bi9zb7/Episode_154_Live_Birth.mp3"
    guid: "commondescentpodcast.podbean.com/2bc8a350-4880-3184-9d1c-d515f7a7a1c5"
    description: "Viviparity is the reproductive style where embryos develop inside a parent’s body instead of inside an egg the parent lays. It’s a very familiar habit to us placental mammals, but it’s also an extremely widespread and diverse feature of life. Seriously, it’s ridiculous just how many times viviparity has evolved and just how many different ways species have found to be viviparous. In this episode we’ll answer such questions as: How and why does viviparity evolve? What features vary from one viviparous group to the next? And how do we identify viviparous animals in the fossil record?\nIn the news: army ants, oldest lizards, beaver families, and swimming dinosaurs.\nTime markers:\nIntro & Announcements: 00:00:00\nNews: 00:04:30\nMain discussion, Part 1: 00:33:30\nMain discussion, Part 2: 01:13:30\nPatron question: 01:46:30\nCheck out our blog for bonus info and pictures:\nhttp://commondescentpodcast.wordpress.com/\nThe 2022 End of the Year Q&A Form is LIVE! Submit your question now!\nhttps://forms.gle/GTgew75GmVxAKejt6\nFollow this link for a 30-day free trial to Audible!\nwww.audibletrial.com/CommonDescent\nJoin us on Patreon to support the podcast and enjoy bonus content! https://www.patreon.com/commondescentpodcast\nOr make a one-time donation via PayPal: https://tinyurl.com/4c68u4hp\nFind merch at the Common Descent Store! http://zazzle.com/common_descent\nJoin the Common Descent Discord server! https://discord.gg/CwPBxdh9Ev\nFollow and Support us on:\nTwitter: https://twitter.com/CommonDescentPC\nFacebook: https://www.facebook.com/commondescentpodcast\nInstagram: @commondescentpodcast\nYouTube: https://www.youtube.com/channel/UCePRXHEnZmTGum2r1l2mduw\nPodBean: https://commondescentpodcast.podbean.com/\niTunes: https://itunes.apple.com/us/podcast/the-common-descent-podcast/id1207586509?mt=2\nYou can email us at commondescentpodcast(at)gmail.com\nOr send us physical mail at:\nThe Common Descent Podcast\n1735 W State of Franklin Rd. Ste 5 #165\nJohn