    guid: "commondescentpodcast.podbean.com/episode-41-evolution-of-whales-255a1b0a5f10feb05e5a81cf3202a8cc"
    description: "There have been several times in evolutionary history where a land-dwelling group has transitioned to life in the water, but few have done it so successfully as the cetaceans. Not only are modern whales diverse and fascinating, but their ancestors have left behind an incredible fossil record of their transition into the sea. All that and more as we discuss the Evolution of Whales.\nIn the news: the evolution of ant castes, the strange skulls of aye-ayes, really old worms (maybe), and a shark turnover.\nTime markers:\nIntro & Announcements: 00:00:00\nNews: 00:06:00\nMain discussion, Part 1: 00:34:00\nMain discussion, Part 2: 00:59:00\nPatron question: 01:38:30\nCheck out Will’s guest appearance on The Cruise Geeks podcast! https://thecruisegeeks.podbean.com/e/the-cruise-geeks-episode-26-geekettes-and-sharks/\nToday’s Patron Question comes from Cheryl!\nCheck out our blog for bonus info and pictures:\nhttp://commondescentpodcast.wordpress.com/\nFollow and Support us on:\nPatreon: https://www.patreon.com/commondescentpodcast\nTwitter: https://twitter.com/CommonDescentPC\nFacebook: https://www.facebook.com/commondescentpodcast/\nPodBean: https://commondescentpodcast.podbean.com/\niTunes: https://itunes.apple.com/us/podcast/the-common-descent-podcast/id1207586509?mt=2\nYouTube: https://www.youtube.com/channel/UCePRXHEnZmTGum2r1l2mduw\nThe Intro and Outro music is “On the Origin of Species” by Protodome.\nMore music like this at http://ocremix.org.\nMuscial Interludes are \"Professor Umlaut\" by Kevin MacLeod (incompetech.com). Licensed under Creative Commons: By Attribution 3.0\nhttp://creativecommons.org/licenses/by/3.0/"
