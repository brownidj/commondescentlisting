    original_title: "Episode 31 - The Ediacaran Biota"
    date: "2018-03-25"
    published_raw: "Sun, 25 Mar 2018 00:09:09 -0500"
    type: "Main"
    rss_episode_type: "full"
    page_url: "https://commondescentpodcast.podbean.com/e/episode-31-the-ediacaran-biota/"
    audio_url: "https://mcdn.podbean.com/mf/web/n7indv/Episode_31_-_The_Ediacaran_Biota.mp3"
    guid: "commondescentpodcast.podbean.com/episode-31-the-ediacaran-biota-24b00f90dd1700f333f1ee8f1a4eedd1"
    description: "Before life as we know it, and before even the Cambrian Explosion, there was a time when the Earth was home to an assortment of strange squishy creatures so unusual that they defy most of our best attempts at classification. This episode, we discuss life’s earliest experiments with complex bodies: the Ediacaran Biota.\nIn the news: the last pterosaurs, ancient lost tails, island spider evolution, and the legs of gators and crocs.\nTime markers:\nIntro & Announcements: 00:00:00\nNews: 00:05:30\nMain discussion: 00:31:30\nPlease take our LISTENER SURVEY! https://goo.gl/forms/sY8YUr5cme59ORR03\nCheck out our blog for bonus info and pictures:\nhttp://commondescentpodcast.wordpress.com/\nFollow and Support us on:\nPatreon: https://www.patreon.com/commondescentpodcast\nTwitter: https://twitter.com/CommonDescentPC\nFacebook: https://www.facebook.com/commondescentpodcast/\nPodBean: https://commondescentpodcast.podbean.com/\niTunes: https://itunes.apple.com/us/podcast/the-common-descent-podcast/id1207586509?mt=2\nYouTube: https://www.youtube.com/channel/UCePRXHEnZmTGum2r1l2mduw\nThe Podcast music is “On the Origin of Species” by Protodome.\nMore music like this at http://ocremix.org."
