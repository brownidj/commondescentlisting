    rss_episode_number: "235"
    title: "Claws"
    original_title: "Episode 163 - Claws"
    date: "2023-04-15"
    published_raw: "Sat, 15 Apr 2023 19:00:00 -0500"
    type: "Main"
    rss_episode_type: "full"
    page_url: "https://commondescentpodcast.podbean.com/e/episode-163-claws/"
    audio_url: "https://mcdn.podbean.com/mf/web/fp3dmc/Episode_163_Claws.mp3"
    guid: "commondescentpodcast.podbean.com/3337d6a0-7f11-3478-9fc5-27e6d2c044a5"
    description: "Check the fingers and toes of your favorite vertebrate animals and you’re likely to find claws or something similar at the ends. These digit-caps come in a variety of shapes – claws, nails, even hooves – for a variety of functions. In this episode, we discuss the close relationship between claw form and function, how we study claws in the fossil record, and the intriguing questions of how claws came to be as we know them today.\nIn the news: swimming temnospondyls, ants and plants, Troodon eggs, and cooked snails.\nTime markers:\nIntro & Announcements: 00:00:00\nNews: 00:05:30\nMain discussion, Part 1: 00:38:15\nMain discussion, Part 2: 01:17:45\nPatron question: 01:45:45\nListen to us on I Know Dino!\nhttps://iknowdino.com/sinotyrannus-episode-437/\nWill was a guest on Sprites of Life!\nhttps://open.spotify.com/episode/7KmiNQcKWgpT6Nn0FRrMMp\nCheck out our blog for bonus info and pictures:\nhttp://commondescentpodcast.com/\nJoin us on Patreon to support the podcast and enjoy bonus content! https://www.patreon.com/commondescentpodcast\nFollow this link for a 30-day free trial to Audible!\nwww.audibletrial.com/CommonDescent\nOr make a one-time donation via PayPal: https://tinyurl.com/4c68u4hp\nFind merch at the Common Descent Store! http://zazzle.com/common_descent\nJoin the Common Descent Discord server! https://discord.gg/CwPBxdh9Ev\nFollow and Support us on:\nTwitter: https://twitter.com/CommonDescentPC\nFacebook: https://www.facebook.com/commondescentpodcast\nInstagram: @commondescentpodcast\nYouTube: https://www.youtube.com/channel/UCePRXHEnZmTGum2r1l2mduw\nPodBean: https://commondescentpodcast.podbean.com/\niTunes: https://itunes.apple.com/us/podcast/the-common-descent-podcast/id1207586509?mt=2\nYou can email us at commondescentpodcast(at)gmail.com\nOr send us physical mail at:\nThe Common Descent Podcast\n1735 W State of Franklin Rd. Ste 5 #165\nJohnson City, TN 37604\nThe Intro and Outro music is “On the Origin of Species” by Protodome.\nMor