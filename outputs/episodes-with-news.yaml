    title: "Crabs and Carcinization"
    original_title: "Episode 117 - Crabs and Carcinization"
    date: "2021-07-10"
    published_raw: "Sat, 10 Jul 2021 19:15:00 -0500"
    type: "Main"
    rss_episode_type: "full"
    page_url: "https://commondescentpodcast.podbean.com/e/episode-117-crabs-and-carcinization/"
