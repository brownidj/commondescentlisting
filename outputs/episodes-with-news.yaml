  - episode_number: "95"
    rss_episode_number: "141"
    title: "The Carboniferous Rainforest Collapse"
    original_title: "Episode 95 – The Carboniferous Rainforest Collapse"
    date: "2020-09-05"
    published_raw: "Sat, 05 Sep 2020 20:47:31 -0500"
    type: "Main"
    rss_episode_type: "full"
    page_url: "https://commondescentpodcast.podbean.com/e/episode-95-%e2%80%93-the-carboniferous-rainforest-collapse/"
    audio_url: "https://mcdn.podbean.com/mf/web/e7u96v/Episode_95_Carboniferous_Rainforest_Collapse.mp3"
    guid: "commondescentpodcast.podbean.com/594b6a8a-b930-3301-9004-fa2aa7b71d89"
    description: "This episode marks the end of our extinction series, but on the bright side, Aly’s here!\nMost of the extinction events we discuss are very animal-focused, but the end of the Carboniferous Period featured one of history’s worst plant extinctions. This event wiped out the famous ecosystems of the Carboniferous, reshuffled ecosystems, and ushered in a more familiar world of plants. In this episode, as usual, we discuss what happened, why, and how it impacted the world.\nIn the news: a croc-bitten sloth, a dinosaur embryo, dinosaur dimorphism, and ancient hibernation.\nTime markers:\nIntro & Announcements: 00:00:00\nNews: 00:09:00\nMain discussion, Part 1: 00:46:30\nMain discussion, Part 2: 01:21:00\nPatron question: 01:55:30\nFollow Aly on Twitter (@kyrietree) or Instagram (@paleolorax)\nCheck out our blog for bonus info and pictures:\nhttp://commondescentpodcast.wordpress.com/\nNew merch at the Common Descent Store! http://zazzle.com/common_descent\nFeaturing art by Rob Soto! https://www.rob-soto.com/\nFollow and Support us on:\nPatreon: https://www.patreon.com/commondescentpodcast\nTwitter: https://twitter.com/CommonDescentPC\nFacebook: https://www.facebook.com/commondescentpodcast\nInstagram: @commondescentpodcast\nPodBean: https://commondescentpodcast.podbean.com/\niTunes: https://itunes.apple.com/us/podcast/the-common-descent-podcast/id1207586509?mt=2\nYouTube: https://www.youtube.com/channel/UCePRXHEnZmTGum2r1l2mduw\nThe Intro and Outro music is “On the Origin of Species” by Protodome.\nMore music like this at http://ocremix.org.\nMusical Interludes are \"Professor Umlaut\" by Kevin MacLeod (incompetech.com). Licensed under Creative Commons: By Attribution 3.0\nhttp://creativecommons.org/licenses/by/3.0/"
